      const others = isNew ? state.demons.length : state.demons.length - 1;
      document.querySelectorAll("[data-sec]").forEach(b => b.onclick = () => {
        const end = b.dataset.sec === "main" ? Math.min(state.mainSize, others+1) : b.dataset.sec === "ext" ? Math.min(state.extSize, others+1) : others+1;
        $("#f_pos").value = Math.max(1, end);
      });
      bindFillSelect("d", "f", $("#formStatus"));
      const bindRecDel = () => document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => b.parentElement.remove());
      $("#addRec").onclick = () => { $("#recs").insertAdjacentHTML("beforeend", recRow()); bindRecDel(); };
      bindRecDel(); enableRowDrag($("#recs"));
      $("#sortRec").onclick = () => {
        const box = $("#recs"), rows = [...box.children];
        rows.sort((a,b) => (+b.querySelector('[data-k="progress"]').value||0) - (+a.querySelector('[data-k="progress"]').value||0)).forEach(x => box.appendChild(x));
      };
      const del = $("#delBtn");
      if (del) del.onclick = () => {
        if (del.dataset.confirm){ if (openDemon===d.id) openDemon=null; save({...state, demons:state.demons.filter(x=>x.id!==d.id)}, {log:true}); close(); }
        else { del.dataset.confirm = "1"; del.textContent = "¿Seguro? Pulsa otra vez"; }
      };
      $("#df").addEventListener("submit", e => {
        e.preventDefault();
        const recs = [...document.querySelectorAll(".rec-edit")].map(r => ({
          player: r.querySelector('[data-k="player"]').value.trim(),
          progress: Math.max(0, Math.min(100, Number(r.querySelector('[data-k="progress"]').value)||0)),
          video: r.querySelector('[data-k="video"]').value.trim()
        })).filter(r => r.player);
        const nd = {...d, name:$("#f_name").value.trim(), publisher:$("#f_pub").value.trim(), creator:$("#f_cre").value.trim(),
          verifier:$("#f_ver").value.trim(), levelId:$("#f_lid").value.trim(), req:(()=>{ const r=Number($("#f_req").value); return (r>=1 && r<100) ? Math.round(r) : null; })(),
          video:$("#f_vid").value.trim(), thumb:$("#f_thumb").value.trim(), notes:$("#f_notes").value.trim(), records:recs, ...readArt("f")};
        if (!nd.name){ $("#formStatus").textContent = "Escribe el nombre del nivel."; return; }
        const arr = state.demons.filter(x=>x.id!==d.id);
        const p = Math.max(1, Math.min(arr.length+1, Number($("#f_pos").value)||arr.length+1));
        arr.splice(p-1, 0, nd);
        const next = applyMove({...state, demons:arr}, opts, nd.id, "d");
        save(next, {log:true}); close();
      });
    });
  }

  function openSiteForm(){
    const th = state.theme || {}, tc = themeColors(th);
    loadedFonts = null;
    modal(`<h3>Editar sitio</h3><form id="sf">
      <label class="f">Título<input id="s_title" value="${esc(state.title)}"></label>
      <label class="f" style="margin-top:12px">Subtítulo<input id="s_tag" value="${esc(state.tagline)}"></label>
      <label class="f" style="margin-top:12px">Texto “Acerca de”<textarea id="s_about" rows="6">${esc(state.about)}</textarea><span class="hint">Cada salto de línea se respeta tal cual.</span></label>
      <div class="grid2" style="margin-top:12px">
        <label class="f">Link de Discord<input id="s_dc" value="${esc(state.discordUrl)}" placeholder="https://discord.gg/..."></label>
        <label class="f">Link para subir récords<input id="s_sub" value="${esc(state.submitUrl)}" placeholder="https://..."></label>
        <label class="f">Tamaño lista principal<input id="s_main" type="number" min="1" value="${state.mainSize}"></label>
        <label class="f">Último puesto de la extendida<input id="s_ext" type="number" min="1" value="${state.extSize}"></label>
      </div>
      <div class="sub">Apariencia</div>
      <div class="grid2">
        <label class="f">Modo
          <select id="s_mode">
            <option value="auto" ${!th.mode||th.mode==="auto"?"selected":""}>Automático (según el dispositivo)</option>
            <option value="dark" ${th.mode==="dark"?"selected":""}>Oscuro</option>
            <option value="light" ${th.mode==="light"?"selected":""}>Claro</option>
          </select></label>
        <label class="f">Transparencia de los cuadros: <span id="s_alv">${th.boxAlpha ?? 100}%</span> <span class="hint">menos = se ve más la imagen de fondo</span>
          <input id="s_al" type="range" min="30" max="100" step="5" value="${th.boxAlpha ?? 100}"></label>
      </div>
      <p class="hint" style="margin:12px 0 6px">Colores. Marca “Por defecto” para dejar el color original de ese elemento.</p>
      <div class="colors">${COLOR_KEYS.map(([k,v,label]) => {
        const val = tc[k], cur = val || (getComputedStyle(document.documentElement).getPropertyValue(v).trim().match(/^#[0-9a-f]{6}$/i) || ["#888888"])[0];
        return `<div class="crow"><input type="color" id="c_${k}" value="${esc(cur)}" aria-label="${esc(label)}"><span class="cl">${esc(label)}</span>
          <label><input type="checkbox" id="cd_${k}" ${val?"":"checked"}> Por defecto</label></div>`;
      }).join("")}</div>
      <div class="grid2" style="margin-top:12px">
        <label class="f">Letra de títulos
          <select id="s_ft">${FONTS.map(f => `<option value="${f}" ${(th.fontTitle||"Chakra Petch")===f?"selected":""} style="font-family:'${f}'">${f}</option>`).join("")}</select></label>
        <label class="f">Letra del texto
          <select id="s_fb">${FONTS.map(f => `<option value="${f}" ${(th.fontBody||"Nunito Sans")===f?"selected":""}>${f}</option>`).join("")}</select></label>
      </div>
      <p class="hint" id="s_fprev" style="margin:8px 0 0">Vista previa: <span id="s_fpt" style="font-weight:700;font-size:1.1rem">Bloodbath #1</span> · <span id="s_fpb">publicado por Riot</span></p>
      <label class="f" style="margin-top:12px">Imagen de fondo <span class="hint">link directo a una imagen (.jpg, .png, .webp). Vacío = sin imagen.</span>
        ${imgField("s_bg", th.bg, "https://.../fondo.jpg o pulsa Subir")}</label>
      <label class="f" style="margin-top:12px">Oscurecer fondo: <span id="s_dimv">${th.bgDim ?? 80}%</span> <span class="hint">más alto = el texto se lee mejor</span>
        <input id="s_dim" type="range" min="0" max="95" step="5" value="${th.bgDim ?? 80}"></label>
      <div class="foot"><span class="status" id="sStatus"></span><button type="button" class="btn" id="cancel">Cancelar</button><button class="btn primary" type="submit">Guardar</button></div></form>`, close => {
      $("#cancel").onclick = close;
      bindUploads($("#sStatus"));
      $("#s_al").addEventListener("input", e => $("#s_alv").textContent = e.target.value + "%");
      COLOR_KEYS.forEach(([k]) => $("#c_"+k).addEventListener("input", () => $("#cd_"+k).checked = false));
      $("#s_dim").addEventListener("input", e => $("#s_dimv").textContent = e.target.value + "%");
      const prev = () => { loadFonts([$("#s_ft").value, $("#s_fb").value]); $("#s_fpt").style.fontFamily = fontStack($("#s_ft").value); $("#s_fpb").style.fontFamily = fontStack($("#s_fb").value); };
      $("#s_ft").addEventListener("change", prev); $("#s_fb").addEventListener("change", prev); prev();
      $("#sf").addEventListener("submit", e => {
        e.preventDefault();
        const colors = {};
        COLOR_KEYS.forEach(([k]) => { if (!$("#cd_"+k).checked) colors[k] = $("#c_"+k).value; });
        const theme = { mode: $("#s_mode").value, colors, boxAlpha: Number($("#s_al").value),
          bg: $("#s_bg").value.trim(), bgDim: Number($("#s_dim").value),
          fontTitle: $("#s_ft").value === "Chakra Petch" ? "" : $("#s_ft").value,
          fontBody: $("#s_fb").value === "Nunito Sans" ? "" : $("#s_fb").value };
        const m = Math.max(1, Number($("#s_main").value)||75);
        const x = Math.max(m, Number($("#s_ext").value)||150);
        save({...state, title:$("#s_title").value.trim()||"Demonlist", tagline:$("#s_tag").value.trim(), about:$("#s_about").value.trim(),
          discordUrl:$("#s_dc").value.trim(), submitUrl:$("#s_sub").value.trim(), mainSize:m, extSize:x, theme});
        close();
      });
    });
  }

  function openJson(){
    modal(`<h3>Importar / exportar JSON</h3>
      <p class="hint" style="margin-top:0">Copia este texto para hacer un respaldo. Para importar, pega un JSON con el mismo formato y pulsa “Reemplazar lista”.</p>
      <label class="f">Datos<textarea class="json" id="j_txt">${esc(JSON.stringify(state,null,2))}</textarea></label>
      <div class="foot"><span class="status" id="jStatus"></span>
        <button class="btn" id="jCopy">Copiar</button><button class="btn" id="cancel">Cerrar</button><button class="btn primary" id="jImport">Reemplazar lista</button></div>`, close => {
      $("#cancel").onclick = close;
      $("#jCopy").onclick = () => {
        const t = $("#j_txt");
        navigator.clipboard?.writeText(t.value).then(()=>$("#jStatus").textContent="Copiado.").catch(()=>{ t.select(); $("#jStatus").textContent="Texto seleccionado: usa Ctrl+C."; });
      };
      const imp = $("#jImport");
      imp.onclick = () => {
        let data;
        try { data = JSON.parse($("#j_txt").value); } catch { $("#jStatus").textContent = "El JSON no es válido."; return; }
        if (!Array.isArray(data.demons)){ $("#jStatus").textContent = "Falta la lista “demons”."; return; }
        if (!imp.dataset.confirm){ imp.dataset.confirm="1"; imp.textContent="¿Seguro? Pulsa otra vez"; return; }
        data.demons = data.demons.map(d => ({records:[], ...d, id:d.id||uid()}));
        if (data.upcoming && !Array.isArray(data.upcoming)) delete data.upcoming;
        if (data.changelog && !Array.isArray(data.changelog)) delete data.changelog;
        save({...state, ...data}); openDemon=null; close();
      };
    });
  }

  // ---------- eventos ----------
  $("#tabs").addEventListener("click", e => {
    const t = e.target.closest(".tab"); if (!t) return;
    tab = t.dataset.tab; openDemon = null; openPlayer = null; openUp = null; openRun = null; query = ""; render();
  });
  $("#loginBtn").onclick = openLogin;
  $("#logoutBtn").onclick = logout;
  $("#addDemon").onclick = () => openDemonForm(null);
  $("#editSite").onclick = openSiteForm;
  $("#openJson").onclick = openJson;
  $("#addRun").onclick = () => { tab = "runs"; openDemon = openPlayer = openUp = openRun = null; render(); openRunForm(null); };
  $("#addUp").onclick = () => { tab = "up"; openDemon = openPlayer = openUp = null; render(); openUpForm(null); };
  $("#clAll").onclick = openChangelogAll;
  $("#clEdit").onclick = openChangelogEditor;
  $("#modEdit").onclick = openModsEditor;
  $("#editBadges").onclick = openBadgesEditor;
  $("#openBlocked").onclick = openBlockedNames;
  $("#acct").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.id === "acctLogin") openAccountLogin();
    if (b.id === "acctMe"){ openPlayer = me.k; openDemon = openUp = null; render(); window.scrollTo({top:0}); }
    if (b.id === "acctOut") playerLogout();
  });

  // ---------- botón "atrás" del navegador ----------
  // Cada vista tiene su dirección (#/leaderboard, #/nivel/…), así el navegador puede volver atrás.
  const TAB_SLUG = {main:"principal", ext:"extendida", leg:"legacy", up:"futuros", runs:"hardest-runs", stats:"leaderboard", roul:"ruleta", send:"subir-record", pend:"pendientes"};
  const SLUG_TAB = Object.fromEntries(Object.entries(TAB_SLUG).map(([k,v]) => [v,k]));
  let restoring = false;
  function viewHash(){
    const enc = encodeURIComponent;
    if (openDemon) return "#/nivel/" + enc(openDemon);
    if (openPlayer) return "#/jugador/" + enc(openPlayer);
    if (openUp) return "#/futuro/" + enc(openUp);
    if (openRun) return "#/run/" + enc(openRun);
    return "#/" + (TAB_SLUG[tab] || "principal");
  }
  function syncHash(){
    const h = viewHash();
    if (h === location.hash) return;
    try {
      if (restoring || !location.hash) history.replaceState(null, "", h);
      else history.pushState(null, "", h);
    } catch {}
  }
  function readHash(){
    const parts = location.hash.replace(/^#\/?/, "").split("/");
    const kind = parts[0] || "", id = decodeURIComponent(parts.slice(1).join("/") || "");
    openDemon = openPlayer = openUp = openRun = null;
    if (kind === "nivel" && id) openDemon = id;
    else if (kind === "jugador" && id) { openPlayer = id.toLowerCase(); tab = "stats"; }
    else if (kind === "futuro" && id) { openUp = id; tab = "up"; }
    else if (kind === "run" && id) { openRun = id; tab = "runs"; }
    else if (SLUG_TAB[kind]) tab = SLUG_TAB[kind];
    else tab = "main";
    if (openDemon){ const i = state.demons.findIndex(d => d.id === openDemon); if (i >= 0) tab = section(i+1); }
    query = "";
  }
  window.addEventListener("popstate", () => {
    if (!loaded) return;
    document.getElementById("modalRoot").innerHTML = "";
    restoring = true; readHash(); render(); restoring = false;
    window.scrollTo({top:0});
  });

  async function boot(){
    const meReq = session ? api("/api/cuenta", {action:"me"}).then(d => { me = {name:d.name, k:pkey(d.name)}; }).catch(e => { if (e.status === 401) clearSession(); }) : null;
    if (password){
      try { const r = await fetch("/api/login",{method:"POST",headers:{"x-admin-password":password}}); editing = r.ok; if (!r.ok) logout(); } catch {}
    }
    try {
      const r = await fetch("/api/list", {cache:"no-store"});
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || "Error " + r.status);
      applyData(d);
      if (meReq) await meReq;
      readHash();
      loaded = true; restoring = true; render(); restoring = false;
      if (editing) loadPending();
    } catch (err) {
      loaded = true; render();
      $("#view").innerHTML = `<div class="empty"><strong>No se pudo cargar la lista</strong>${esc(err.message || "Revisa tu conexión y recarga la página.")}</div>`;
    }
  }
  render();
  boot();
})();
</script>
</body>
</html>
