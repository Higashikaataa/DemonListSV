<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demonlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: ranked list on the left, info/editor sidebar on the right; detail view replaces the list */
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface-2:#f6f8fb; --line:#dce1ea;
  --fg:#151a24; --muted:#5d6778; --accent:#c4253a; --accent-ink:#ffffff; --accent-soft:#fbe7ea;
  --gold:#b98a12; --silver:#7d8796; --bronze:#a3622c; --ok:#1d7a4b; --warn:#a15c00;
  --display:"Chakra Petch", "Arial Narrow", system-ui, sans-serif;
  --body:"Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:10px;
  --title:var(--fg); --header:var(--surface); --rowtext:var(--gold);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1117; --surface:#161a22; --surface-2:#1c212b; --line:#2a313d;
  --fg:#e8ecf3; --muted:#9aa4b4; --accent:#ff4d62; --accent-ink:#1a0408; --accent-soft:#3a1720;
  --gold:#e6b94a; --silver:#b4bdca; --bronze:#d18a52; --ok:#4fc58a; --warn:#f0a845; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1117; --surface:#161a22; --surface-2:#1c212b; --line:#2a313d;
  --fg:#e8ecf3; --muted:#9aa4b4; --accent:#ff4d62; --accent-ink:#1a0408; --accent-soft:#3a1720;
  --gold:#e6b94a; --silver:#b4bdca; --bronze:#d18a52; --ok:#4fc58a; --warn:#f0a845; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--header)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--header);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand h1{font-family:var(--display);font-size:1.5rem;font-weight:700;margin:0;letter-spacing:.02em;line-height:1.1;text-wrap:balance}
.brand h1 span{color:var(--accent)}
.brand h1,.section-head h2,.name,.detail-hero h2,.modal h3,.lvname,.mod-name,.empty strong,.pname{color:var(--title)}
#aboutText{white-space:pre-line;overflow-wrap:anywhere}
.brand p{margin:0;color:var(--headertext, var(--muted));font-size:.85rem}
header.top .brand h1{color:var(--headertext, var(--title))}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{font-family:var(--display);font-weight:600;font-size:.9rem;letter-spacing:.04em;text-transform:uppercase;background:none;border:1px solid transparent;color:var(--headertext, var(--muted));padding:7px 12px;border-radius:8px;cursor:pointer}
.tab:hover{color:var(--fg);background:var(--surface-2)}
.tab[aria-selected="true"]{color:var(--accent);border-color:var(--line);background:var(--surface-2)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main.wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;padding-block:24px 48px}
@media (max-width:860px){main.wrap{grid-template-columns:minmax(0,1fr)}}
.section-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.section-head h2{font-family:var(--display);font-size:1.35rem;margin:0;text-wrap:balance}
.section-head .count{color:var(--muted);font-size:.9rem}
.search{margin-left:auto;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0;width:220px;max-width:100%}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:minmax(150px,30%) minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;cursor:pointer;text-align:left;width:100%;transition:border-color .15s, transform .15s}
.row:hover{border-color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.row:hover{transform:translateX(2px)}}
.thumb{aspect-ratio:16/9;width:100%;max-width:100%;border-radius:7px;overflow:hidden;position:relative;background:linear-gradient(135deg,var(--surface-2),var(--accent-soft));display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{font-family:var(--display);font-weight:700;font-size:1.9rem;color:var(--accent);opacity:.85}
.row-main{min-width:0}
.row-title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pos{font-family:var(--display);font-weight:700;font-size:1.25rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.pos.p1{color:var(--gold)}.pos.p2{color:var(--silver)}.pos.p3{color:var(--bronze)}
.name{font-family:var(--display);font-weight:600;font-size:1.2rem;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:.88rem;overflow-wrap:anywhere}
.pts{font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.pts small{display:block;color:var(--muted);font-family:var(--body);font-weight:400;font-size:.75rem}
@media (max-width:520px){.row{grid-template-columns:minmax(0,38%) minmax(0,1fr) auto;gap:10px}.row .name{font-size:1rem}.pts{font-size:.9rem}.edit-tools{flex-direction:column}.thumb .ph{font-size:1.3rem}}
.row .name{font-size:1.3rem}
.pts.pct{color:var(--accent)}
.lvrows{display:flex;flex-direction:column;gap:8px}
.lvrow{display:grid;grid-template-columns:minmax(0,33%) 64px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;min-height:64px;padding:0 18px 0 0;border:1px solid var(--line);border-radius:9px;cursor:pointer;text-align:left;overflow:hidden;
  background:var(--surface-2);color:var(--rowtext);font-family:var(--display);font-weight:700;font-size:1.05rem;transition:border-color .15s, transform .15s}
.lvimg{align-self:stretch;min-height:64px;background:linear-gradient(135deg,var(--surface),var(--accent-soft));-webkit-mask-image:linear-gradient(90deg,#000 72%,transparent);mask-image:linear-gradient(90deg,#000 72%,transparent)}
.lvimg.has{background:var(--img) center/cover no-repeat}
.lvrow:hover{border-color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.lvrow:hover{transform:translateX(2px)}}
.lvrow .lvname{min-width:0;overflow-wrap:anywhere}
.lvrow .lvpos,.lvrow .lvpts{font-variant-numeric:tabular-nums;white-space:nowrap;color:inherit;font-size:inherit;margin:0}
@media (max-width:520px){.lvrow{grid-template-columns:minmax(0,30%) 44px minmax(0,1fr) auto;gap:8px;padding-right:10px;font-size:.9rem}}
.cl-list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.cl-item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 8px;font-size:.88rem;align-items:baseline}
.cl-date{font-family:var(--display);font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.cl-text{min-width:0;overflow-wrap:anywhere}
.cl-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:middle}
.cl-dot.add{background:var(--ok)}.cl-dot.down{background:var(--warn)}
.cl-edit{display:grid;grid-template-columns:140px minmax(0,1fr) auto;gap:6px;margin-bottom:6px}
.cl-edit input{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-width:0;width:100%}
@media (max-width:520px){.cl-edit{grid-template-columns:1fr auto}.cl-edit .t{grid-column:1/-1;grid-row:2}}
.edit-tools{display:flex;gap:4px}
.ibtn{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:4px 8px;cursor:pointer;font-size:.82rem;line-height:1.3}
.ibtn:hover{border-color:var(--accent);color:var(--accent)}
.ibtn:disabled{opacity:.4;cursor:default}
aside{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel h3{font-family:var(--display);font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
.panel p{margin:0 0 8px}
.panel p:last-child{margin-bottom:0}
.legend{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:.9rem}
.legend b{font-family:var(--display);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--accent)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.mode{display:flex;align-items:center;gap:8px;font-weight:600}
.switch{appearance:none;width:40px;height:22px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:left .15s}
.switch:checked{background:var(--accent)}
.switch:checked::after{left:21px}
.status{font-size:.85rem;color:var(--muted)}
.status.err{color:var(--accent)}
.status.ok{color:var(--ok)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:32px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--fg);font-family:var(--display);font-size:1.1rem;margin-bottom:4px}
/* detail */
.back{background:none;border:none;color:var(--accent);cursor:pointer;padding:0;font-weight:700;margin-bottom:12px}
.detail-hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
@media (max-width:640px){.detail-hero{grid-template-columns:minmax(0,1fr)}}
.detail-hero .thumb .ph{font-size:3rem}
.detail-hero h2{font-family:var(--display);font-size:2rem;margin:0;line-height:1.1;overflow-wrap:anywhere;text-wrap:balance}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:14px}
.fact{min-width:0}
.fact span{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.fact b{font-family:var(--display);font-weight:600;overflow-wrap:anywhere}
.chip{display:inline-block;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.chip.ext{background:var(--surface-2);color:var(--warn)}
.chip.leg{background:var(--surface-2);color:var(--muted)}
a{color:var(--accent)}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:16px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;background:var(--surface-2)}
tr:last-child td{border-bottom:none}
td.num{font-variant-numeric:tabular-nums;font-family:var(--display);font-weight:600}
.bar{display:inline-block;width:70px;height:6px;border-radius:3px;background:var(--line);vertical-align:middle;margin-left:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.full{background:var(--ok)}
.bar.seg i{background:var(--warn)}
.rec-edit.run-edit{grid-template-columns:auto minmax(0,1.2fr) 180px minmax(0,1.4fr) auto}
.run-edit > span{width:100%;min-width:0}
.run-edit span input,.pct2 input{flex:1 1 0;width:auto;min-width:48px;padding:6px 4px;text-align:center}
.pct2{display:flex;gap:6px;align-items:center;color:var(--fg)}
@media (max-width:520px){.rec-edit.run-edit{grid-template-columns:auto 1fr 150px auto}}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,12,18,.55);z-index:20;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:min(640px,100%);max-height:calc(100% - 32px);overflow:auto;padding:20px}
.modal h3{font-family:var(--display);font-size:1.3rem;margin:0 0 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.82rem;font-weight:700;color:var(--muted);min-width:0}
label.f input,label.f textarea,label.f select{font-weight:400;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:8px 10px;min-width:0;width:100%}
.rec-edit{display:grid;grid-template-columns:auto minmax(0,1.3fr) 80px minmax(0,1.6fr) auto;gap:6px;margin-bottom:6px;align-items:center;border-radius:8px}
.rec-edit.dragging{outline:2px solid var(--accent);background:var(--surface);position:relative;z-index:2}
.rec-edit input{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-width:0;width:100%}
@media (max-width:520px){.rec-edit{grid-template-columns:auto 1fr 70px auto}.rec-edit .v{grid-column:2/-1;grid-row:2}}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px;align-items:center}
.modal .foot .status{margin-right:auto}
.sub{font-family:var(--display);font-size:.9rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 8px}
.hint{font-size:.8rem;color:var(--muted);font-weight:400}
textarea.json{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;min-height:220px}
</style>
<style>
.top-links{display:flex;gap:8px;flex-wrap:wrap}
.top-links a{text-decoration:none}
.roul-card{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;align-items:center}
@media (max-width:640px){.roul-card{grid-template-columns:minmax(0,1fr)}}
.roul-need{font-family:var(--display);font-size:2.6rem;font-weight:700;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.roul-hist{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.roul-hist div{display:flex;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:.92rem}
.roul-hist b{font-family:var(--display);font-variant-numeric:tabular-nums}
.inline-form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.plink{background:none;border:none;padding:0;color:var(--pname, var(--accent));font-weight:700;cursor:pointer;text-align:left}
.plink:hover{text-decoration:underline}
.lvchips{display:flex;flex-wrap:wrap;gap:6px}
.lvchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:.9rem;max-width:100%;text-align:left}
.lvchip:hover{border-color:var(--accent)}
.lvpos{font-family:var(--display);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.lvpts{font-family:var(--display);font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:2px}
.av{position:relative;display:inline-grid;place-items:center;flex:none;border-radius:50%;overflow:hidden;background:var(--accent-soft);color:var(--accent);font-family:var(--display);font-weight:700;border:1px solid var(--line)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pcell{display:inline-flex;align-items:center;gap:10px}
.tab .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:.72rem;line-height:18px;text-align:center}
.acct{display:flex;gap:8px;align-items:center}
.acct .me{display:inline-flex;align-items:center;gap:8px;max-width:180px}
.acct .me span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.phero{position:relative;overflow:hidden}
.phero.has-banner{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);padding:0}
.phero.has-banner .pbody{padding:18px;min-width:0}
.pbanner{align-self:stretch;background:var(--img) center/cover no-repeat;min-height:180px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 35%);mask-image:linear-gradient(90deg,transparent,#000 35%)}
@media (max-width:640px){.phero.has-banner{grid-template-columns:minmax(0,1fr)}.pbanner{order:-1;min-height:120px;-webkit-mask-image:linear-gradient(180deg,#000 55%,transparent);mask-image:linear-gradient(180deg,#000 55%,transparent)}}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.bdg{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;cursor:help;font-family:var(--display);font-weight:700;color:var(--accent);font-size:.9rem;flex:none}
.bdg img{width:100%;height:100%;object-fit:contain}
.bdg.sm{width:20px;height:20px;border-radius:6px;font-size:.65rem}
.pcell .badges{margin:0;gap:3px}
#tip{position:fixed;z-index:50;max-width:240px;padding:8px 10px;border-radius:8px;background:var(--fg);color:var(--bg);font-size:.82rem;line-height:1.35;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#tip b{display:block;font-family:var(--display);font-size:.9rem}
.bdg-edit{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 10px;align-items:center;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.bdg-edit input{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-width:0;width:100%}
.bdg-edit .wide{grid-column:2/-1}
.bdg-pick{display:flex;flex-wrap:wrap;gap:8px}
.bdg-pick label{display:flex;align-items:center;gap:6px;padding:6px 10px 6px 6px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);cursor:pointer;font-size:.88rem}
.bdg-pick input:checked + .bdg{outline:2px solid var(--accent)}
.danger-zone{border:1px solid color-mix(in srgb, var(--accent) 45%, var(--line));border-radius:10px;padding:12px;margin-top:10px}
.pbio{white-space:pre-line;overflow-wrap:anywhere;margin:10px 0 0;max-width:62ch}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:14px}
.seg button{border:none;background:var(--surface-2);padding:8px 14px;cursor:pointer;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sendgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:16px;align-items:start}
@media (max-width:760px){.sendgrid{grid-template-columns:minmax(0,1fr)}}
.subitem{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.subitem .stxt{min-width:0}
.subitem .sl{font-family:var(--display);font-weight:700;color:var(--title);overflow-wrap:anywhere}
.subitem .sm{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.subitem .sacts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.subitem .warn{color:var(--warn);font-size:.85rem}
.sublist{display:flex;flex-direction:column;gap:10px}
.drag{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;padding:4px 8px;border-radius:7px;border:1px solid var(--line);background:var(--surface-2);font-size:1rem;line-height:1.2}
.drag:active{cursor:grabbing}
.row.dragging{opacity:.85;border-color:var(--accent);box-shadow:0 8px 24px rgba(0,0,0,.25);position:relative;z-index:2}
body.is-dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
.phead{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.phead .pinfo{min-width:0;flex:1 1 220px}
.mods{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.mod{display:flex;align-items:center;gap:10px;min-width:0}
.mod .mtxt{min-width:0;flex:1}
.mod-name{font-family:var(--display);font-weight:700;display:block;overflow-wrap:anywhere}
.mod-role{font-size:.8rem;color:var(--muted)}
.mod a{font-size:.82rem;font-weight:700;text-decoration:none;white-space:nowrap}
.mod-edit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:6px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.mod-edit input{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-width:0;width:100%}
.mod-edit .wide{grid-column:1/-1}
.upl{display:flex;gap:8px;align-items:center}
.upl input[type=text],.upl input:not([type]){flex:1 1 auto}
.upl .btn{padding:7px 12px;white-space:nowrap;font-size:.85rem;color:var(--fg)}
.colors{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px 14px}
.crow{display:flex;align-items:center;gap:8px;font-size:.85rem}
.crow input[type=color]{width:42px;height:30px;padding:1px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);flex:none}
.crow .cl{flex:1;min-width:0}
.crow label{display:flex;gap:4px;align-items:center;font-size:.75rem;color:var(--muted);white-space:nowrap}
.stage{position:relative;border-radius:14px;isolation:isolate}
.stage.has-art{padding:14px;border:1px solid var(--line);overflow:hidden;background:var(--surface)}
.stage.has-art::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--art) center/cover no-repeat;opacity:var(--artop)}
.stage.has-art .detail-hero,.stage.has-art .panel,.stage.has-art .tablebox,.stage.has-art .empty{background:color-mix(in srgb, var(--surface) 62%, transparent);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.inline-form input{width:110px;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:8px 10px}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1 id="siteTitle">Demonlist</h1>
      <p id="siteTag">Cargando lista…</p>
    </div>
    <nav class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-tab="main" aria-selected="true">Principal</button>
      <button class="tab" role="tab" data-tab="ext" aria-selected="false">Extendida</button>
      <button class="tab" role="tab" data-tab="leg" aria-selected="false">Legacy</button>
      <button class="tab" role="tab" data-tab="up" aria-selected="false">Futuros niveles</button>
      <button class="tab" role="tab" data-tab="runs" aria-selected="false">Hardest runs</button>
      <button class="tab" role="tab" data-tab="stats" aria-selected="false">Leaderboard</button>
      <button class="tab" role="tab" data-tab="roul" aria-selected="false">Ruleta</button>
      <button class="tab" role="tab" data-tab="send" aria-selected="false">Subir récord</button>
      <button class="tab" role="tab" data-tab="pend" aria-selected="false" id="pendTab" hidden>Pendientes<span class="badge" id="pendBadge" hidden></span></button>
    </nav>
    <div class="top-links" id="topLinks"></div>
    <div class="acct" id="acct"></div>
  </div>
</header>

<main class="wrap">
  <section id="view" aria-live="polite">
    <div class="empty"><strong>Cargando la lista</strong>Los demons aparecerán aquí en un momento.</div>
  </section>
  <aside>
    <div class="panel">
      <h3>Acerca de la lista</h3>
      <p id="aboutText"></p>
    </div>
    <div class="panel">
      <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:8px"><h3 style="margin:0;margin-right:auto">Changelog</h3>
        <button class="ibtn" id="clAll">Ver todo</button><button class="ibtn" id="clEdit" hidden>Editar</button></div>
      <ul class="cl-list" id="clList"></ul>
    </div>
    <div class="panel">
      <h3>Secciones</h3>
      <div class="legend" id="legend"></div>
    </div>
    <div class="panel">
      <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:10px"><h3 style="margin:0;margin-right:auto">Moderadores</h3>
        <button class="ibtn" id="modEdit" hidden>Editar</button></div>
      <ul class="mods" id="modList"></ul>
    </div>
    <div class="panel" id="editorPanel">
      <h3>Editor</h3>
      <div id="loginBox">
        <p class="hint" style="margin-top:0">Solo para administradores de la lista.</p>
        <button class="btn" id="loginBtn">Entrar al modo editor</button>
      </div>
      <div id="editorTools" hidden>
        <div style="display:flex;flex-direction:column;gap:8px">
          <div class="btn-row">
            <button class="btn primary" id="addDemon">+ Agregar demon</button>
            <button class="btn" id="addUp">+ Futuro nivel</button>
            <button class="btn" id="addRun">+ Hardest run</button>
            <button class="btn" id="editSite">Editar sitio</button>
          </div>
          <div class="btn-row"><button class="btn" id="editBadges">Badges</button><button class="btn" id="openBlocked">Nombres bloqueados</button></div>
          <button class="btn" id="openJson">Importar / exportar JSON</button>
          <button class="btn" id="logoutBtn">Salir del modo editor</button>
        </div>
      </div>
      <p class="status" id="saveStatus" style="margin-top:10px"></p>
    </div>
  </aside>
</main>

<div id="modalRoot"></div>
<div id="tip" role="tooltip" hidden></div>

<script>
(() => {
  const $ = (s, el=document) => el.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const uid = () => Math.random().toString(36).slice(2, 10);

  let state = { title:"Demonlist", tagline:"", about:"", discordUrl:"", submitUrl:"", mainSize:75, extSize:150, demons:[], upcoming:[], changelog:[], players:{}, mods:[] };
  let loaded = false, editing = false, password = "";
  let tab = "main", openDemon = null, openUp = null, openRun = null, query = "";
  let me = null, session = "", pending = null, pendingErr = "", mySubs = null;
  try { session = localStorage.getItem("dl_session") || ""; } catch {}
  const cssUrl = v => esc(String(v||"").replace(/['"()\\\s<>]/g, c => "%" + c.charCodeAt(0).toString(16).padStart(2,"0")));
  try { password = sessionStorage.getItem("dl_pw") || ""; } catch {}

  // ---------- puntos (fórmula de Pointercrate: #1 = 350, #150 = 18.71) ----------
  function basePoints(pos){
    if (pos < 1 || pos > state.extSize || pos > 150) return 0;
    if (pos <= 3)  return -18.2899079915 * pos + 368.2899079915;
    if (pos <= 20) return (326.1 * Math.exp(-0.0871 * pos) + 51.09) * 1.037117142;
    if (pos <= 35) return ((250 - 83.389) * Math.pow(1.0099685, 2 - pos) - 31.152) * 1.0371139743;
    if (pos <= 55) return (212.61 * Math.pow(1.036, 1 - pos) + 25.071) * 1.0371139743;
    return (185.7 * Math.exp(-0.02715 * pos) + 14.84) * 1.039035131;
  }
  // List% que pones en cada nivel. Vacío o 100 = solo cuenta el 100%.
  // Al llegar justo al list% se gana el 10% de los puntos (ej. #1: 35.00), y sube hasta el total al 100%.
  function reqFor(d, pos){
    const r = Number(d.req);
    return (r >= 1 && r < 100) ? r : 100;
  }
  function recordPoints(pos, progress, req){
    const b = basePoints(pos);
    if (!b) return 0;
    if (progress >= 100) return b;
    // Como en Pointercrate: los porcentajes solo cuentan en la lista principal
    if (pos > state.mainSize || req >= 100 || progress < req) return 0;
    return b * Math.pow(5, (progress - req) / (100 - req)) / 10;
  }

  // ---------- jugadores ----------
  function buildPlayers(){
    const players = new Map();
    const get = name => {
      const k = name.toLowerCase();
      if (!players.has(k)) players.set(k, {name, pts:0, entries:[], runs:[]});
      return players.get(k);
    };
    state.demons.forEach((d,i) => {
      const pos = i+1, req = reqFor(d,pos);
      const seen = new Set();
      const ver = (d.verifier||"").trim();
      if (ver){
        const p = get(ver); const pts = recordPoints(pos,100,req);
        p.pts += pts; p.entries.push({d,pos,progress:100,pts,verified:true,video:d.video});
        seen.add(ver.toLowerCase());
      }
      for (const r of d.records||[]){
        const name = (r.player||"").trim(); if (!name) continue;
        const k = name.toLowerCase();
        const pr = Math.max(0,Math.min(100,+r.progress||0));
        if (seen.has(k)){
          // mismo jugador repetido: se queda solo con su mejor progreso
          const p = get(name), e = p.entries.find(x => x.d === d);
          if (e && !e.verified && pr > e.progress){ const np = recordPoints(pos,pr,req); p.pts += np - e.pts; Object.assign(e,{progress:pr,pts:np,video:r.video}); }
          continue;
        }
        seen.add(k);
        const p = get(name), pts = recordPoints(pos,pr,req);
        p.pts += pts; p.entries.push({d,pos,progress:pr,pts,verified:false,video:r.video});
      }
    });
    // Progresos en futuros niveles (no dan puntos)
    (state.upcoming||[]).forEach((u,i) => {
      const name = (u.player||"").trim(); if (!name) return;
      get(name).entries.push({d:u, pos:null, upPos:i+1, progress:clampPct(u.progress), pts:0, verified:false, upcoming:true, video:u.video});
    });
    // Hardest runs (no dan puntos): el mejor run de cada jugador en cada nivel
    (state.runs||[]).forEach((d,i) => {
      const best = new Map();
      for (const rr of d.records||[]){
        const name = (rr.player||"").trim(); if (!name) continue;
        const k = name.toLowerCase(), cur = best.get(k);
        if (!cur || runBetter(rr, cur)) best.set(k, rr);
      }
      best.forEach(rr => get(rr.player.trim()).runs.push({d, pos:i+1, from:clampPct(rr.from), progress:clampPct(rr.to), pts:0, run:true, video:rr.video}));
    });
    // Jugadores con cuenta aunque no tengan récords
    (state.accounts||[]).forEach(n => { if (String(n||"").trim()) get(String(n).trim()); });
    const rows = [...players.values()].sort((a,b)=>b.pts-a.pts || a.name.localeCompare(b.name));
    rows.forEach((p,i) => p.rank = i+1);
    return rows;
  }
  let openPlayer = null;
  const fmt = n => n.toFixed(2);
  const section = pos => pos <= state.mainSize ? "main" : pos <= state.extSize ? "ext" : "leg";

  // ---------- YouTube ----------
  function ytId(v){
    if (!v) return "";
    if (/^[\w-]{11}$/.test(v)) return v;
    const m = v.match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/);
    return m ? m[1] : "";
  }
  function ytLink(v){
    if (!v) return "";
    if (/^https?:\/\//.test(v)) return v;
    return "https://www.youtube.com/watch?v=" + encodeURIComponent(v);
  }
  function thumbSrc(d){
    if (d.thumb) return d.thumb;
    const id = ytId(d.video);
    return id ? `https://img.youtube.com/vi/${id}/mqdefault.jpg` : "";
  }
  // Imagen en perfiles: la de perfiles > la personalizada (si se permite) > miniatura del video
  function profileImg(d){
    if (d.profileImg) return d.profileImg;
    if (d.art && d.artInProfile !== false) return d.art;
    return thumbSrc(d);
  }
  function stageOpen(d){
    if (!d.art) return `<div class="stage">`;
    const op = Math.max(0, Math.min(100, Number(d.artOpacity ?? 35))) / 100;
    return `<div class="stage has-art" style="--art:url('${cssUrl(d.art)}');--artop:${op}">`;
  }
  function ytChannelUrl(v){
    v = String(v||"").trim(); if (!v) return "";
    if (/^https?:\/\//i.test(v)) return v;
    if (/^UC[\w-]{22}$/.test(v)) return "https://www.youtube.com/channel/" + v;
    return "https://www.youtube.com/@" + v.replace(/^@/, "");
  }
  function thumbHTML(d, pos){
    const s = thumbSrc(d);
    return s ? `<div class="thumb"><img src="${esc(s)}" alt="" loading="lazy"></div>`
             : `<div class="thumb"><span class="ph">#${pos}</span></div>`;
  }

  // ---------- render ----------
  // ---------- apariencia (colores y fondo) ----------
  function hexLum(h){
    const m = /^#?([0-9a-f]{6})$/i.exec(h||""); if (!m) return null;
    const n = parseInt(m[1],16), c = [n>>16&255, n>>8&255, n&255].map(v => { v/=255; return v<=.03928 ? v/12.92 : Math.pow((v+.055)/1.055,2.4); });
    return .2126*c[0] + .7152*c[1] + .0722*c[2];
  }
  const FONTS = ["Chakra Petch","Nunito Sans","Lexend","Orbitron","Russo One","Audiowide","Bebas Neue","Exo 2","Rajdhani","Oswald","Montserrat","Poppins","Roboto","Press Start 2P"];
  const fontStack = f => `"${f}", system-ui, sans-serif`;
  let loadedFonts = "";
  function loadFonts(list){
    const fams = [...new Set(list.filter(f => FONTS.includes(f) && f !== "Chakra Petch" && f !== "Nunito Sans"))];
    const key = fams.join("|");
    if (key === loadedFonts) return;
    loadedFonts = key;
    document.getElementById("customFonts")?.remove();
    if (!fams.length) return;
    const l = document.createElement("link");
    l.id = "customFonts"; l.rel = "stylesheet";
    l.href = "https://fonts.googleapis.com/css2?" + fams.map(f => "family=" + f.replace(/ /g,"+") + ":wght@400;600;700").join("&") + "&display=swap";
    document.head.appendChild(l);
  }
  // Colores configurables: clave -> variable CSS
  const COLOR_KEYS = [
    ["title","--title","Títulos y nombres de niveles"],
    ["text","--fg","Texto normal"],
    ["muted","--muted","Texto secundario (fechas, “publicado por”)"],
    ["accent","--accent","Color principal (botones, links, pestañas)"],
    ["rowtext","--rowtext","Puestos y puntos en perfiles"],
    ["bgc","--bg","Fondo de la página"],
    ["header","--header","Barra de arriba"],
    ["surface","--surface","Cuadros (tarjetas y paneles)"],
    ["surface2","--surface-2","Cuadros internos (botones, campos, tablas)"],
    ["line","--line","Bordes de los cuadros"],
    ["headertext","--headertext","Letras de la barra de arriba"],
    ["pname","--pname","Nombres de jugadores (por defecto)"]
  ];
  function themeColors(t){
    const c = {...(t.colors||{})};
    if (!c.accent && t.accent) c.accent = t.accent;   // versiones anteriores
    if (!c.text && t.text) c.text = t.text;
    return c;
  }
  function applyTheme(){
    const t = state.theme || {}, root = document.documentElement, c = themeColors(t);
    loadFonts([t.fontTitle, t.fontBody].filter(Boolean));
    if (FONTS.includes(t.fontTitle)) root.style.setProperty("--display", fontStack(t.fontTitle)); else root.style.removeProperty("--display");
    if (FONTS.includes(t.fontBody)) root.style.setProperty("--body", fontStack(t.fontBody)); else root.style.removeProperty("--body");
    if (t.mode === "light" || t.mode === "dark") root.setAttribute("data-theme", t.mode); else root.removeAttribute("data-theme");
    // limpiar y aplicar colores
    COLOR_KEYS.forEach(([,v]) => root.style.removeProperty(v));
    ["--accent-ink","--accent-soft"].forEach(k => root.style.removeProperty(k));
    COLOR_KEYS.forEach(([k,v]) => { if (hexLum(c[k]) !== null) root.style.setProperty(v, c[k]); });
    if (hexLum(c.text) !== null && hexLum(c.muted) === null) root.style.setProperty("--muted", `color-mix(in srgb, ${c.text} 62%, var(--bg))`);
    const lum = hexLum(c.accent);
    if (lum !== null){
      root.style.setProperty("--accent-ink", lum > .4 ? "#111111" : "#ffffff");
      root.style.setProperty("--accent-soft", `color-mix(in srgb, ${c.accent} 18%, var(--surface))`);
    }
    // transparencia de cuadros
    const alpha = Math.max(30, Math.min(100, Number(t.boxAlpha ?? 100)));
    if (alpha < 100){
      const cs = getComputedStyle(root);
      ["--surface","--surface-2","--header"].forEach(v => {
        const base = cs.getPropertyValue(v).trim();
        if (base) root.style.setProperty(v, `color-mix(in srgb, ${base} ${alpha}%, transparent)`);
      });
    }
    if (t.bg){
      const dim = Math.max(0, Math.min(95, Number(t.bgDim ?? 80)));
      document.body.style.backgroundImage = `linear-gradient(color-mix(in srgb, var(--bg) ${dim}%, transparent), color-mix(in srgb, var(--bg) ${dim}%, transparent)), url("${String(t.bg).replace(/["\\]/g,"")}")`;
      document.body.style.backgroundSize = "cover";
      document.body.style.backgroundPosition = "center";
      document.body.style.backgroundAttachment = "fixed";
    } else {
      ["backgroundImage","backgroundSize","backgroundPosition","backgroundAttachment"].forEach(k => document.body.style[k] = "");
    }
  }

  // ---------- fotos de perfil ----------
  const pkey = name => String(name||"").trim().toLowerCase();
  function playerInfo(name){
    const k = pkey(name), base = (state.players||{})[k] || {}, own = (state.profiles||{})[k] || {};
    const out = {...base};
    for (const f of ["avatar","youtube","nameColor","banner","bio"]) if (own[f]) out[f] = own[f];
    return out;
  }
  const nameStyle = name => { const c = playerInfo(name).nameColor; return /^#[0-9a-f]{6}$/i.test(c||"") ? ` style="color:${c}"` : ""; };
  function playerAvatar(name){
    const i = playerInfo(name);
    if (i.avatar) return i.avatar;
    if (i.youtube) return "/api/avatar?yt=" + encodeURIComponent(i.youtube);
    return "";
  }
  function discordId(v){ const m = String(v||"").match(/(?:users\/)?(\d{15,22})(?!\d)/); return m ? m[1] : ""; }
  function discordLink(v){
    v = String(v||"").trim(); if (!v) return "";
    if (/^https?:\/\//i.test(v)) return v;
    const id = discordId(v); return id ? "https://discord.com/users/" + id : "";
  }
  function modAvatar(m){ if (m.avatar) return m.avatar; const id = discordId(m.discord); return id ? "/api/avatar?dc=" + id : ""; }
  function avHTML(name, src, size){
    const ini = esc((String(name||"?").trim()[0] || "?").toUpperCase());
    return `<span class="av" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.42)}px" aria-hidden="true">${ini}${src ? `<img src="${esc(src)}" alt="" loading="lazy" onerror="this.remove()">` : ""}</span>`;
  }

  // ---------- subir imágenes ----------
  async function shrink(file){
    if (file.type === "image/gif" || file.size < 350*1024) return file;
    try {
      const bmp = await createImageBitmap(file);
      const max = 1600, k = Math.min(1, max / Math.max(bmp.width, bmp.height));
      const cv = document.createElement("canvas");
      cv.width = Math.round(bmp.width*k); cv.height = Math.round(bmp.height*k);
      cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
      let blob = await new Promise(res => cv.toBlob(res, "image/webp", .86));
      if (!blob || blob.type !== "image/webp") blob = await new Promise(res => cv.toBlob(res, "image/jpeg", .88));
      return blob && blob.size < file.size ? blob : file;
    } catch { return file; }
  }
  async function uploadImage(file){
    const body = await shrink(file);
    const auth = editing ? {"x-admin-password": password} : {"x-session": session};
    const r = await fetch("/api/upload", {method:"POST", headers:{"content-type": body.type || file.type, ...auth}, body});
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || "Error " + r.status);
    return d.url;
  }
  // Campo de imagen: link + botón "Subir"
  function imgField(id, value, placeholder){
    return `<span class="upl"><input id="${id}" value="${esc(value||"")}" placeholder="${esc(placeholder||"Link de una imagen")}">
      <label class="btn">Subir<input type="file" accept="image/png,image/jpeg,image/webp,image/gif" data-upload="${id}" hidden></label></span>`;
  }
  function bindUploads(statusEl){ bindUploadsIn(document, statusEl); }
  function bindUploadsIn(scope, statusEl){
    scope.querySelectorAll("[data-upload]").forEach(inp => {
      if (inp.dataset.bound) return; inp.dataset.bound = "1";
      inp.addEventListener("change", async () => {
      const f = inp.files[0]; if (!f) return;
      const target = document.getElementById(inp.dataset.upload);
      const say = m => { if (statusEl) statusEl.textContent = m; };
      if (f.size > 15*1024*1024){ say("Esa imagen es demasiado grande (máx. 15 MB)."); return; }
      say("Subiendo imagen…");
      try { target.value = await uploadImage(f); target.dispatchEvent(new Event("input")); say("Imagen subida."); }
      catch(e){ say("No se pudo subir: " + e.message); }
      inp.value = "";
      });
    });
  }

  function render(){
    applyTheme();
    document.title = state.title || "Demonlist";
    $("#siteTitle").textContent = state.title || "Demonlist";
    $("#siteTag").textContent = state.tagline || "";
    $("#aboutText").textContent = state.about || "Ranking de demons ordenados por dificultad.";
    $("#legend").innerHTML = `<b>1–${state.mainSize}</b><span>Lista principal</span><b>${state.mainSize+1}–${state.extSize}</b><span>Lista extendida</span><b>${state.extSize+1}+</b><span>Legacy (sin puntos)</span>`;
    $("#topLinks").innerHTML =
      (state.discordUrl ? `<a class="btn" href="${esc(state.discordUrl)}" target="_blank" rel="noopener">Discord</a>` : "") +
      (state.submitUrl ? `<a class="btn primary" href="${esc(state.submitUrl)}" target="_blank" rel="noopener">Subir récord</a>` : "");
    document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.tab === tab && !openDemon && !openPlayer && !openUp && !openRun)));
    renderAccount();
    $("#pendTab").hidden = !editing;
    if (!editing && tab === "pend") tab = "main";
    const pc = pending ? pending.length : 0;
    $("#pendBadge").hidden = !pc; $("#pendBadge").textContent = pc;
    renderChangelog();
    renderMods();
    $("#clEdit").hidden = !editing;
    $("#modEdit").hidden = !editing;
    $("#loginBox").hidden = editing;
    $("#editorTools").hidden = !editing;
    if (!loaded) return;
    syncHash();
    const v = $("#view");
    if (openDemon){ v.innerHTML = detailHTML(); bindDetail(); bindPlayerLinks(); return; }
    if (openPlayer){ v.innerHTML = profileHTML(); bindProfile(); return; }
    if (openUp){ v.innerHTML = upDetailHTML(); bindUpDetail(); return; }
    if (openRun){ v.innerHTML = runDetailHTML(); bindRunDetail(); bindPlayerLinks(); return; }
    if (tab === "runs"){ v.innerHTML = runsListHTML(); bindRunsList(); return; }
    if (tab === "up"){ v.innerHTML = upListHTML(); bindUpList(); return; }
    if (tab === "stats"){ v.innerHTML = statsHTML(); bindPlayerLinks(); return; }

      if (j<0 || j>=state.demons.length) return;

  // ---------- arrastrar niveles (modo editor) ----------
  function startDrag(e){
    if (e.button !== undefined && e.button !== 0) return;
    e.preventDefault(); e.stopPropagation();
    const row = e.target.closest(".row"), list = row.parentElement;
    const rid = x => x.dataset.open || x.dataset.ropen, key = list.dataset.src === "runs" ? "runs" : "demons";
    const before = [...list.querySelectorAll(".row")].map(rid);
    row.classList.add("dragging"); document.body.classList.add("is-dragging");
    let lastY = e.clientY, scrollTimer = null;
    const place = y => {
      const rows = [...list.querySelectorAll(".row")].filter(x => x !== row);
      let target = null;
      for (const x of rows){ const b = x.getBoundingClientRect(); if (y < b.top + b.height/2){ target = x; break; } }
      if (target) { if (row.nextElementSibling !== target) list.insertBefore(row, target); }
      else if (list.lastElementChild !== row) list.appendChild(row);
    };
    const edgeScroll = () => {
      const h = window.innerHeight, m = 70;
      if (lastY < m) window.scrollBy(0, -14); else if (lastY > h - m) window.scrollBy(0, 14); else return;
      place(lastY);
    };
    scrollTimer = setInterval(edgeScroll, 30);
    const move = ev => { lastY = ev.clientY; place(ev.clientY); };
    const end = () => {
      clearInterval(scrollTimer);
      window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", end); window.removeEventListener("pointercancel", end);
      row.classList.remove("dragging"); document.body.classList.remove("is-dragging");
      const after = [...list.querySelectorAll(".row")].map(rid);
      if (after.join() === before.join()) return;
      // La pestaña muestra un tramo seguido de la lista: se reemplaza ese tramo con el nuevo orden
      const src = state[key] || [];
      const start = src.findIndex(d => d.id === before[0]);
      const byId = new Map(src.map(d => [d.id, d]));
      const arr = src.slice();
      arr.splice(start, after.length, ...after.map(id => byId.get(id)));
      save({...state, [key]:arr}, {log: key === "demons"});
    };
    window.addEventListener("pointermove", move); window.addEventListener("pointerup", end); window.addEventListener("pointercancel", end);
  }

  // ---------- ruleta ----------
  // Reglas clásicas: el 1er demon pide 1%, cada siguiente pide 1% más que lo que lograste.
  let roul = null; // {pool, need, current, hist:[{name,got}], done, msg}
  function roulPool(scope){
    const n = scope === "ext" ? state.extSize : state.mainSize;
    return state.demons.slice(0, n).map((d,i)=>({d,pos:i+1}));
  }
  function roulNext(){
    if (!roul.pool.length){ roul.done = true; roul.msg = "Se acabaron los demons. ¡Ruleta completada!"; return; }
    const k = Math.floor(Math.random()*roul.pool.length);
    roul.current = roul.pool.splice(k,1)[0];
  }
  function roulHTML(){
    let html = `<div class="section-head"><h2>Ruleta</h2><span class="count">Empieza en 1% y cada demon pide 1% más que el anterior</span></div>`;
    if (!roul){
      return html + `<div class="panel"><p>Elige de dónde salen los demons y pulsa empezar.</p>
        <div class="inline-form"><select id="r_scope" class="btn" aria-label="Demons de la ruleta">
          <option value="main">Lista principal</option><option value="ext">Principal + extendida</option></select>
        <button class="btn primary" id="r_start">Empezar ruleta</button></div></div>`;
    }
    if (roul.done){
      html += `<div class="empty"><strong>${esc(roul.msg)}</strong>Llegaste a ${roul.hist.length} demons.</div>`;
    } else {
      const {d,pos} = roul.current;
      html += `<div class="roul-card">${thumbHTML(d,pos)}
        <div style="min-width:0"><span class="pos">#${pos}</span> <span class="name">${esc(d.name)}</span>
          <div class="meta">por ${esc(d.publisher||d.creator||"—")}${d.levelId?" · ID "+esc(d.levelId):""}</div>
          <div style="margin-top:12px" class="hint">Necesitas al menos</div><div class="roul-need">${roul.need}%</div>
          <form class="inline-form" id="r_form"><input type="number" id="r_got" min="${roul.need}" max="100" placeholder="${roul.need}" aria-label="Porcentaje logrado" required>
            <button class="btn primary" type="submit">Lo logré</button><button class="btn" type="button" id="r_quit">Rendirme</button></form>
          <p class="status err" id="r_msg"></p></div></div>`;
    }
    if (roul.hist.length){
      html += `<div class="roul-hist">` + roul.hist.map((h,i)=>`<div><span>${i+1}. ${esc(h.name)}</span><b>${h.got}%</b></div>`).join("") + `</div>`;
    }
    return html + `<div class="btn-row" style="margin-top:14px"><button class="btn" id="r_reset">Reiniciar ruleta</button></div>`;
  }
  function bindRoul(){
    $("#r_start")?.addEventListener("click", () => {
      const pool = roulPool($("#r_scope").value);
      if (!pool.length){ return; }
      roul = {pool, need:1, current:null, hist:[], done:false, msg:""}; roulNext(); render();
    });
    $("#r_form")?.addEventListener("submit", e => {
      e.preventDefault();
      const got = Math.round(Number($("#r_got").value));
      if (!(got >= roul.need && got <= 100)){ $("#r_msg").textContent = `Escribe un número entre ${roul.need} y 100.`; return; }
      roul.hist.push({name:roul.current.d.name, got});
      if (got >= 100){ roul.done = true; roul.msg = "¡Llegaste al 100%! Ruleta completada."; }
      else { roul.need = got + 1; roulNext(); }
      render();
    });
    $("#r_quit")?.addEventListener("click", () => { roul.done = true; roul.msg = `Te rendiste en ${roul.current.d.name} (necesitabas ${roul.need}%).`; render(); });
    $("#r_reset")?.addEventListener("click", () => { roul = null; render(); });
  }


  // ---------- changelog ----------
  const SEC_NAME = {main:"Lista principal", ext:"Lista extendida", leg:"Legacy"};
  const SEC_RANK = {main:0, ext:1, leg:2};
  function today(){
    const d = new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function fmtDate(iso){
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||"");
    if (!m) return esc(iso||"");
    const mes = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"][+m[2]-1] || m[2];
    return `${+m[3]} ${mes} ${m[1]}`;
  }
  // Compara la lista antes y después de un cambio y anota altas y bajadas de sección.
  function diffChanges(oldArr, newArr, cfg){
    const secOf = pos => pos <= cfg.mainSize ? "main" : pos <= cfg.extSize ? "ext" : "leg";
    const oldPos = new Map(oldArr.map((d,i) => [d.id, i+1]));
    const out = [], date = today();
    newArr.forEach((d,i) => {
      const pos = i+1;
      if (!oldPos.has(d.id)){
        out.push({id:uid(), date, type:"add", text:`${d.name} fue agregado en el puesto #${pos} (${SEC_NAME[secOf(pos)]})`});
        return;
      }
      const from = secOf(oldPos.get(d.id)), to = secOf(pos);
      if (SEC_RANK[to] > SEC_RANK[from])
        out.push({id:uid(), date, type:"down", text:`${d.name} bajó de ${SEC_NAME[from]} a ${SEC_NAME[to]} (#${pos})`});
    });
    return out;
  }
  function sortedLog(){
    return (state.changelog||[]).map((e,i)=>({e,i})).sort((a,b) => (b.e.date||"").localeCompare(a.e.date||"") || a.i-b.i).map(x=>x.e);

  // ---------- badges ----------
  function badgeIcon(bd, small){
    const ini = esc((String(bd.name||"?").trim()[0] || "?").toUpperCase());
    return `<span class="bdg${small ? " sm" : ""}" tabindex="0" data-tip-title="${esc(bd.name)}" data-tip="${esc(bd.desc||"")}" aria-label="${esc(bd.name)}">${bd.img ? `<img src="${esc(bd.img)}" alt="" loading="lazy">` : ini}</span>`;
  }
  // Reglas para ganar badges solos
  // [tipo, texto, ¿usa cantidad X?]
  const BADGE_RULES = [
    ["manual", "Lo doy yo a mano", false],
    ["done", "Completar X extremes (incluye verificados)", true],
    ["main", "Completar X niveles de la main list", true],
    ["hardest", "Completar el nivel más difícil actual (#1)", false],
    ["topn", "Completar un nivel del top X (ej. X = 10)", true],
    ["verified", "Verificar X niveles", true],
    ["creator", "Crear X niveles de la lista (creador o publicador)", true],
    ["points", "Tener X puntos o más", true],
    ["rank", "Estar en el top X del leaderboard", true],
    ["hardestrun", "Tener la hardest run de la lista (#1 de Hardest runs)", false],
    ["runs", "Tener X runs en Hardest runs", true],
    ["upcoming", "Tener progreso en X futuros niveles", true]
  ];
  const ruleNeedsN = t => (BADGE_RULES.find(x => x[0] === t) || [])[2] === true;
  const LOWER_IS_BETTER = new Set(["rank", "topn"]);
  // Separa "A, B & C" o "A y B" en nombres
  const splitNames = v => String(v||"").split(/\s*(?:,|&|\/|\+|\by\b|\band\b)\s*/i).map(x => x.trim()).filter(Boolean);
  const ruleOf = bd => (bd.rule && bd.rule.type && bd.rule.type !== "manual") ? bd.rule : null;
  let statsCache = {src: null, map: new Map()};
  const EMPTY_STATS = {done:0, main:0, verified:0, points:0, rank:Infinity, runs:0, upcoming:0, best:Infinity, creator:0, hardestrun:false};
  function playerStats(name){
    if (statsCache.src !== state){
      const map = new Map();
      buildPlayers().forEach(p => {
        const done = p.entries.filter(e => e.progress >= 100 && !e.upcoming);
        map.set(pkey(p.name), {...EMPTY_STATS,
          done: done.length,
          main: done.filter(e => e.pos <= state.mainSize).length,
          best: done.reduce((m, e) => Math.min(m, e.pos), Infinity),
          verified: p.entries.filter(e => e.verified).length,
          points: p.pts,
          rank: p.pts > 0 ? p.rank : Infinity,
          runs: (p.runs||[]).length,
          upcoming: p.entries.filter(e => e.upcoming).length
        });
      });
      const getS = k => { if (!map.has(k)) map.set(k, {...EMPTY_STATS}); return map.get(k); };
      // Creadores: cuenta cada nivel de la lista donde sale como creador o publicador
      state.demons.forEach(d => {
        new Set([...splitNames(d.creator), ...splitNames(d.publisher)].map(pkey)).forEach(k => { getS(k).creator++; });
      });
      // Dueño de la hardest run: el mejor run del #1 de Hardest runs
      const hr = (state.runs||[])[0] && bestRun(state.runs[0]);
      if (hr) getS(pkey(hr.player)).hardestrun = true;
      statsCache = {src: state, map};
    }
    return statsCache.map.get(pkey(name)) || EMPTY_STATS;
  }
  function earns(bd, st){
    const r = ruleOf(bd); if (!r || !st) return false;
    const n = Number(r.n) || 0;
    if (r.type === "rank") return st.rank <= n;
    if (r.type === "topn") return st.best <= n;
    if (r.type === "hardest") return st.best <= 1;
    if (r.type === "hardestrun") return !!st.hardestrun;
    return (st[r.type] || 0) >= n;
  }
  function playerBadges(name){
    const manual = new Set((((state.players||{})[pkey(name)]||{}).badges) || []);
    const st = playerStats(name);
    let list = (state.badges||[]).filter(bd => ruleOf(bd) ? earns(bd, st) : manual.has(bd.id));
    // De cada tipo de regla, solo el badge más alto (ej. si tiene 10 extremes, sale el de 10 y no el de 5)
    if (state.badgesHighestOnly !== false){
      const best = new Map();
      list.forEach(bd => {
        const r = ruleOf(bd); if (!r) return;
        const cur = best.get(r.type), n = Number(r.n) || 0;
        const better = LOWER_IS_BETTER.has(r.type) ? n < (cur ? Number(cur.rule.n) : Infinity) : n > (cur ? Number(cur.rule.n) : -Infinity);
        if (!cur || better) best.set(r.type, bd);
      });
      list = list.filter(bd => !ruleOf(bd) || best.get(bd.rule.type) === bd);
    }
    return list;
  }
  function badgesHTML(name, small){
    const list = playerBadges(name);
    return list.length ? `<span class="badges">${list.map(bd => badgeIcon(bd, small)).join("")}</span>` : "";
  }

    document.addEventListener("mouseover", e => { const el = e.target.closest("[data-tip-title]"); if (el) show(el); });
    document.addEventListener("mouseout", e => { if (e.target.closest("[data-tip-title]")) hide(); });

        <input data-k="rn" type="number" min="1" value="${esc(rule.n)}" placeholder="X" aria-label="Cantidad" style="width:90px;flex:none" ${ruleNeedsN(rule.type)?"":"hidden"}>

  function openBadgesEditor(){
    modal(`<h3>Badges</h3>
      <p class="hint" style="margin-top:0">Elige cómo se gana cada badge. Los automáticos se dan y se quitan solos según los récords (ej. “Completar X extremes” con X = 5, otro con X = 10…). Los manuales se dan desde el perfil del jugador, en “Opciones de moderador”. Las imágenes cuadradas o PNG sin fondo se ven mejor.</p>

      <form id="bf"><div id="bdRows">${(state.badges||[]).map(badgeRow).join("")}</div>
      <button type="button" class="btn" id="bdAdd">+ Nuevo badge</button>
      <div class="foot"><span class="status" id="bStatus"></span>
        <button type="button" class="btn" id="cancel">Cancelar</button><button class="btn primary" type="submit">Guardar</button></div></form>`, close => {
      $("#cancel").onclick = close;
      const bind = scope => {
        scope.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {

        $("#bdRows").insertAdjacentHTML("beforeend", badgeRow());
        const last = $("#bdRows").lastElementChild; bind(last); last.querySelector('[data-k="name"]').focus();
      };
      $("#bf").addEventListener("submit", e => {
        e.preventDefault();
        const badges = [...document.querySelectorAll("#bdRows .bdg-edit")].map(row => ({
          id: row.dataset.id,
          name: row.querySelector('[data-k="name"]').value.trim(),
          desc: row.querySelector('[data-k="desc"]').value.trim(),
          img: document.getElementById("bd_img_" + row.dataset.id).value.trim(),
          rule: {type: row.querySelector('[data-k="rtype"]').value, n: Math.max(1, Math.round(+row.querySelector('[data-k="rn"]').value || 1))}
        })).filter(b => b.name);
        const bad = badges.find(b => ruleNeedsN(b.rule.type) && !(+document.querySelector(`.bdg-edit[data-id="${b.id}"] [data-k="rn"]`).value > 0));
        if (bad){ $("#bStatus").textContent = `Pon la cantidad (X) del badge “${bad.name}”.`; return; }

  // ---------- subir récords (jugadores) ----------
  let sendKind = "list";
  function levelOptions(){
    const groups = [["main","Lista principal"],["ext","Lista extendida"],["leg","Legacy"]];
    return groups.map(([k,label]) => {
      const items = state.demons.map((d,i) => ({d,pos:i+1})).filter(x => section(x.pos) === k);
      return items.length ? `<optgroup label="${label}">${items.map(({d,pos}) => `<option value="${esc(d.id)}">#${pos} · ${esc(d.name)}</option>`).join("")}</optgroup>` : "";
    }).join("");
  }
  function levelRule(id){
    const i = state.demons.findIndex(d => d.id === id); if (i < 0) return {min:100, text:""};
    const d = state.demons[i], pos = i+1, req = reqFor(d,pos);
    if (pos <= state.mainSize && req < 100) return {min:req, text:`Este nivel acepta progresos desde ${req}% (list%) o el 100%.`};
    return {min:100, text: pos <= state.mainSize ? "En este nivel solo cuenta el 100%." : "Fuera de la lista principal solo cuenta el 100%."};
  }
  function sendHTML(){
    let html = `<div class="section-head"><h2>Subir récord</h2><span class="count">Un moderador lo revisa antes de que salga en la lista</span></div>`;
    if (!me) return html + `<div class="empty"><strong>Inicia sesión para enviar récords</strong>Si ya apareces en la lista, crea tu cuenta con tu mismo nombre.<div class="btn-row" style="justify-content:center;margin-top:12px"><button class="btn primary" id="sLogin">Iniciar sesión</button><button class="btn" id="sReg">Crear cuenta</button></div></div>`;
    const ups = state.upcoming || [];
    html += `<div class="sendgrid"><form class="panel" id="sf2">
      <div class="seg" role="group" aria-label="Tipo de nivel">
        <button type="button" data-kind="list" aria-pressed="${sendKind==="list"}">Nivel de la lista</button>
        <button type="button" data-kind="up" aria-pressed="${sendKind==="up"}">Futuro nivel</button>
        <button type="button" data-kind="run" aria-pressed="${sendKind==="run"}">Hardest run</button>

      <label class="f">Nivel
        <select id="s_lv" required>${sendKind === "list" ? levelOptions() : (sendKind === "run" ? (state.runs||[]) : ups).map(u => `<option value="${esc(u.id)}">${esc(u.name)}</option>`).join("") + `<option value="new">+ Otro nivel (escribir el nombre)</option>`}</select></label>
      <label class="f" id="s_neww" style="margin-top:10px" hidden>Nombre del nivel
        <input id="s_new" maxlength="60" placeholder="Ej. Tartarus"></label>

      <div class="grid2" style="margin-top:12px">
        ${sendKind === "run" ? `<label class="f">Desde (%)<input id="s_from" type="number" min="0" max="99" required value="20"></label>` : ""}
        <label class="f">${sendKind === "run" ? "Hasta (%)" : "Progreso (%)"}<input id="s_pr" type="number" min="1" max="100" required value="100"></label>
        <label class="f">Jugador<input value="${esc(me.name)}" disabled></label>

      <div class="foot"><span class="status" id="s_st"></span><button class="btn primary" type="submit">Enviar récord</button></div>
    </form>
    <div class="panel"><h3>Tus envíos pendientes</h3><div id="mySubs"><p class="hint" style="margin:0">Cargando…</p></div></div></div>`;

  function mySubsHTML(){
    if (!mySubs) return `<p class="hint" style="margin:0">Cargando…</p>`;
    if (!mySubs.length) return `<p class="hint" style="margin:0">No tienes envíos esperando revisión.</p>`;
    return `<div class="sublist">${mySubs.map(x => `<div class="subitem" style="grid-template-columns:minmax(0,1fr)"><div class="stxt">

      <div class="sm">${x.kind === "up" ? "Futuro nivel · " : x.kind === "run" ? "Hardest run · " : ""}enviado ${new Date(x.date).toLocaleDateString("es")}</div></div>
      <div class="sacts"><a href="${esc(x.video)}" target="_blank" rel="noopener">Video ↗</a><button class="ibtn" data-cancel="${esc(x.id)}">Cancelar envío</button></div></div>`).join("")}</div>`;

  async function loadMySubs(){
    try { mySubs = (await api("/api/envios")).items; }
    catch (e){ mySubs = []; if (e.status === 401){ clearSession(); render(); return; } }
    const box = $("#mySubs"); if (box){ box.innerHTML = mySubsHTML(); bindMySubs(); }
  }
  function bindMySubs(){
    document.querySelectorAll("[data-cancel]").forEach(b => b.onclick = async () => {
      if (!b.dataset.confirm){ b.dataset.confirm = "1"; b.textContent = "¿Seguro?"; return; }
      try { await api("/api/envios?id=" + encodeURIComponent(b.dataset.cancel), null, "DELETE"); } catch {}
      loadMySubs();
    });
  }
  function bindSend(){
    $("#sLogin")?.addEventListener("click", () => openAccountLogin("login"));
    $("#sReg")?.addEventListener("click", () => openAccountLogin("register"));
    if (!me) return;
    document.querySelectorAll("[data-kind]").forEach(b => b.onclick = () => { sendKind = b.dataset.kind; render(); });
    const sel = $("#s_lv"), pr = $("#s_pr");
    const upd = () => {
      if (sendKind === "up" || sendKind === "run"){
        const isNew = sel.value === "new", where = sendKind === "run" ? "Hardest runs" : "Futuros niveles";
        $("#s_neww").hidden = !isNew; $("#s_new").required = isNew;
        $("#s_rule").textContent = isNew ? `Escribe el nombre del nivel. Si lo aceptan, se agrega a ${where}.`
          : sendKind === "run" ? "Pon dónde empieza y dónde termina tu run, por ejemplo de 20% a 100%." : "Pon el porcentaje que llevas en este nivel.";
        pr.min = 1; return;
      }
      const rule = levelRule(sel.value); $("#s_rule").textContent = rule.text; pr.min = rule.min;
      if (+pr.value < rule.min) pr.value = rule.min === 100 ? 100 : rule.min;
    };
    sel.addEventListener("change", upd); upd();
    $("#mySubs").innerHTML = mySubsHTML(); bindMySubs();
    if (!mySubs) loadMySubs();
    $("#sf2").addEventListener("submit", async e => {
      e.preventDefault();
      const st = $("#s_st"), progress = Math.round(+pr.value);
      let levelName = "";
      if (sendKind === "list"){
        const d = state.demons.find(x => x.id === sel.value); if (!d){ st.textContent = "Elige un nivel."; return; }
        const rule = levelRule(d.id);
        if (progress < 100 && progress < rule.min){ st.textContent = rule.text; return; }
        levelName = d.name;
      } else {
        if (sel.value === "new"){
          levelName = $("#s_new").value.trim();
          if (levelName.length < 2){ st.textContent = "Escribe el nombre del nivel."; return; }
        } else {
          const u = (sendKind === "run" ? (state.runs||[]) : (state.upcoming||[])).find(x => x.id === sel.value); if (!u){ st.textContent = "Elige un nivel."; return; }
          levelName = u.name;
        }
      }
      const from = sendKind === "run" ? Math.round(+$("#s_from").value) : 0;
      if (sendKind === "run" && !(from >= 0 && from < progress)){ st.textContent = "El run debe empezar antes de donde termina (ej. 20 a 100)."; return; }
      st.textContent = "Enviando…";
      try {
        await api("/api/envios", {kind: sendKind, levelId: sel.value, levelName, progress, from, video: $("#s_vid").value.trim(), note: $("#s_note").value.trim()});
        st.textContent = "¡Enviado! Un moderador lo revisará pronto.";
        $("#s_vid").value = ""; $("#s_note").value = ""; if ($("#s_new")) $("#s_new").value = "";
        loadMySubs();
      } catch (err) {
        st.textContent = err.message;
        if (err.status === 401){ clearSession(); render(); }
      }
    });
  }

  // ---------- pendientes (moderadores) ----------
  async function loadPending(){
    if (!editing) return;
    try {
      const r = await fetch("/api/envios", {headers:{"x-admin-password": password}, cache:"no-store"});
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || "Error " + r.status);
      pending = d.items; pendingErr = "";
    } catch (e) { pendingErr = e.message; if (!pending) pending = []; }
    render();
  }
  function subTarget(x){
    if (x.kind === "run"){
      const runs = state.runs||[];
      const r0 = x.levelId === "new" ? runs.find(y => pkey(y.name) === pkey(x.levelName)) : runs.find(y => y.id === x.levelId);
      if (!r0) return x.levelId === "new" ? {isNew: true, text: "Nivel nuevo: al aceptar se agrega a Hardest runs."} : null;
      const cur = (r0.records||[]).filter(rr => pkey(rr.player) === pkey(x.player)).sort((a,b) => runBetter(a,b) ? -1 : 1)[0];
      return {r: r0, pos: runs.indexOf(r0)+1, text: (x.levelId === "new" ? "Ya existe en Hardest runs. " : "") + (cur ? `Su mejor run ahora: ${clampPct(cur.from)}–${clampPct(cur.to)}%` : "Run nuevo para este jugador")};
    }
    if (x.kind === "up"){
      const findName = () => (state.upcoming||[]).find(y => pkey(y.name) === pkey(x.levelName));
      if (x.levelId === "new"){
        const same = findName();
        return same ? {u: same, text: `Ya existe en Futuros niveles${same.player ? ` (ahora: ${same.player} con ${clampPct(same.progress)}%)` : ""}. Al aceptar se actualiza ese.`}
                    : {isNew: true, text: "Nivel nuevo: al aceptar se agrega a Futuros niveles."};
      }
      const u = (state.upcoming||[]).find(y => y.id === x.levelId);
      return u ? {u, text: u.player ? `Ahora: ${u.player} con ${clampPct(u.progress)}%` : "Nadie tiene progreso registrado"} : null;
    }
    const i = state.demons.findIndex(d => d.id === x.levelId); if (i < 0) return null;
    const d = state.demons[i], cur = (d.records||[]).find(r => pkey(r.player) === pkey(x.player));
    const verif = pkey(d.verifier) === pkey(x.player);
    return {d, pos:i+1, text: verif ? "Este jugador es el verificador del nivel" : cur ? `Ya tiene ${cur.progress}% en este nivel` : "Récord nuevo para este jugador"};
  }
  function pendHTML(){
    let html = `<div class="section-head"><h2>Récords pendientes</h2><span class="count">${pending ? pending.length : 0} por revisar</span>
      <button class="btn" id="pRefresh" style="margin-left:auto">Actualizar</button></div>`;
    if (pendingErr) html += `<p class="status err">No se pudieron cargar: ${esc(pendingErr)}</p>`;
    if (!pending) return html + `<div class="empty"><strong>Cargando envíos</strong></div>`;
    if (!pending.length) return html + `<div class="empty"><strong>No hay récords pendientes</strong>Cuando un jugador envíe uno, aparecerá aquí.</div>`;
    return html + `<div class="sublist">${pending.map(x => {
      const t = subTarget(x);
      const where = !t ? "" : x.kind === "run" ? (t.isNew ? "Hardest run nuevo" : `Hardest runs #${t.pos}`) : x.kind === "up" ? (t.isNew ? "Futuro nivel nuevo" : "Futuro nivel") : `#${t.pos} · ${section(t.pos)==="main"?"Lista principal":section(t.pos)==="ext"?"Lista extendida":"Legacy"}`;
      return `<div class="subitem">${avHTML(x.player, playerAvatar(x.player), 40)}<div class="stxt">
        <div class="sl">${plink(x.player)} · ${esc(x.levelName)} · ${x.kind === "run" ? x.from + "–" : ""}${x.progress}%</div>
        <div class="sm">${where ? esc(where) + " · " : ""}enviado ${new Date(x.date).toLocaleString("es")}</div>
        ${t ? `<div class="sm">${esc(t.text)}</div>` : `<div class="warn">Ese nivel ya no existe en la lista. Solo se puede rechazar.</div>`}
        ${x.note ? `<div class="sm">Nota: “${esc(x.note)}”</div>` : ""}</div>
        <div class="sacts"><a class="btn" href="${esc(x.video)}" target="_blank" rel="noopener">Ver video ↗</a>
          ${t ? `<button class="btn primary" data-accept="${esc(x.id)}">Aceptar</button>` : ""}
          <button class="btn danger" data-reject="${esc(x.id)}">Rechazar</button></div></div>`;
    }).join("")}</div>`;
  }
  async function dropSub(id){
    const r = await fetch("/api/envios?id=" + encodeURIComponent(id), {method:"DELETE", headers:{"x-admin-password": password}});
    if (!r.ok) throw new Error("No se pudo quitar de pendientes.");
    pending = (pending||[]).filter(x => x.id !== id);
  }
  function bindPend(){
    bindPlayerLinks();
    $("#pRefresh")?.addEventListener("click", () => { pending = null; render(); loadPending(); });
    document.querySelectorAll("[data-reject]").forEach(b => b.onclick = async () => {
      if (!b.dataset.confirm){ b.dataset.confirm = "1"; b.textContent = "¿Seguro?"; return; }
      b.disabled = true;
      try { await dropSub(b.dataset.reject); setStatus("Envío rechazado."); } catch (e) { setStatus(e.message, "err"); }
      render();
    });
    document.querySelectorAll("[data-accept]").forEach(b => b.onclick = async () => {
      const x = (pending||[]).find(y => y.id === b.dataset.accept); if (!x) return;
      const t = subTarget(x); if (!t) return;
      b.disabled = true;
      let next;
      if (x.kind === "run"){
        const rec = {player:x.player, from:x.from||0, to:x.progress, video:x.video};
        if (t.isNew){
          next = {...state, runs: [...(state.runs||[]), {id:uid(), name:x.levelName, publisher:"", creator:"", levelId:"", video:"", thumb:"", notes:"", records:[rec]}]};
        } else {
          const id = t.r.id;
          next = {...state, runs: state.runs.map(d => {
            if (d.id !== id) return d;
            const recs = (d.records||[]).slice(), i = recs.findIndex(rr => pkey(rr.player) === pkey(x.player));
            if (i >= 0){ if (runBetter(rec, recs[i]) || runSpan(rec) === runSpan(recs[i])) recs.splice(i, 1); else return d; }
            const cur = recs.find(rr => (rr.player||"").trim());
            if (!cur || runBetter(rec, cur)) recs.unshift(rec); else recs.push(rec); // si supera al mejor, pasa a ser el mejor run
            return {...d, records:recs};
          })};
        }
      } else if (x.kind === "up"){
        if (t.isNew){
          const nu = {id:uid(), name:x.levelName, publisher:"", creator:"", levelId:"", player:x.player, progress:x.progress, video:x.video, thumb:"", notes:""};
          next = {...state, upcoming: [...(state.upcoming||[]), nu]};
        } else {
          const id = t.u.id;
          next = {...state, upcoming: state.upcoming.map(u => u.id === id ? {...u, player:x.player, progress:x.progress, video:x.video} : u)};
        }
      } else {
        next = {...state, demons: state.demons.map(d => {
          if (d.id !== x.levelId) return d;
          const recs = (d.records||[]).slice(), i = recs.findIndex(r => pkey(r.player) === pkey(x.player));
          if (i < 0) recs.push({player:x.player, progress:x.progress, video:x.video});
          else if (x.progress >= (+recs[i].progress||0)) recs[i] = {...recs[i], progress:x.progress, video:x.video};
          return {...d, records:recs};
        })};
      }
      const ok = await save(next);
      if (!ok){ b.disabled = false; return; }
      try { await dropSub(x.id); setStatus(`Récord de ${x.player} aceptado.`, "ok"); } catch (e) { setStatus(e.message, "err"); }
      render();
    });
  }

  // ---------- guardar ----------
  let saving = Promise.resolve();
  function setStatus(msg, cls=""){ const s=$("#saveStatus"); s.textContent=msg; s.className="status "+cls; }
  function save(next, opts={}){
    if (opts.log){
      const entries = diffChanges(state.demons||[], next.demons||[], next);
      if (entries.length) next = {...next, changelog:[...entries, ...(next.changelog||[])]};
    }
    state = next; render();
    setStatus("Guardando…");
    const body = JSON.stringify(state), gen = saveGen;
    pendingSaves++;
    saving = saving.then(() => {
        // Un cambio hecho sobre una copia vieja de la lista no se envía
        if (gen !== saveGen) return {skipped: true};
        return fetch("/api/list", {method:"PUT", headers:{"content-type":"application/json","x-admin-password":password,"x-base-rev":String(serverRev)}, body});
      })
      .then(async r => {
        if (r.skipped) return false;
        if (r.ok){ const d = await r.json().catch(()=>({})); if (d.rev) { serverRev = d.rev; state.rev = d.rev; } setStatus("Cambios guardados.","ok"); return true; }
        const e = await r.json().catch(()=>({}));
        if (r.status === 409){
          saveGen++;
          await refreshList(true);
          setStatus("Otra persona guardó cambios antes que tú. Ya cargué la versión más reciente: vuelve a hacer tu último cambio.","err");
          return false;
        }
        if (r.status === 401){ logout(); setStatus("La contraseña ya no es válida. Entra de nuevo; tus últimos cambios no se guardaron.","err"); }
        else setStatus("No se guardó: " + (e.error || "error " + r.status),"err");
        return false;
      })
      .catch(() => { setStatus("No se guardó: revisa tu conexión.","err"); return false; })
      .finally(() => { pendingSaves--; });
    return saving;
  }

  // ---------- mantener la lista al día ----------
  let serverRev = 0, saveGen = 0, pendingSaves = 0;
  function applyData(d){
    state = {...state, ...d};
    state.demons = (state.demons||[]).map(x => ({records:[], ...x}));
    state.upcoming = Array.isArray(state.upcoming) ? state.upcoming : [];
    state.runs = (Array.isArray(state.runs) ? state.runs : []).map(x => ({records:[], ...x}));
    state.accounts = Array.isArray(state.accounts) ? state.accounts : [];
    state.changelog = Array.isArray(state.changelog) ? state.changelog : [];
    state.mods = Array.isArray(state.mods) ? state.mods : [];
    state.badges = Array.isArray(state.badges) ? state.badges : [];
    state.players = (state.players && typeof state.players === "object" && !Array.isArray(state.players)) ? state.players : {};
    state.profiles = (state.profiles && typeof state.profiles === "object" && !Array.isArray(state.profiles)) ? state.profiles : {};
    serverRev = Number(d.rev) || 0;
  }
  // Trae la versión más reciente. Sin "force", no interrumpe si hay un formulario abierto o un guardado en curso.
  async function refreshList(force){
    if (!force && (pendingSaves || $("#modalRoot").innerHTML || document.body.classList.contains("is-dragging"))) return;
    try {
      const r = await fetch("/api/list", {cache:"no-store"});
      if (!r.ok) return;
      const d = await r.json();
      if (!force && (Number(d.rev) || 0) === serverRev) return;
      if (!force && (pendingSaves || $("#modalRoot").innerHTML)) return;
      applyData(d); render();
    } catch {}
  }
  setInterval(() => { if (editing && document.visibilityState === "visible") refreshList(false); }, 20000);
  document.addEventListener("visibilitychange", () => { if (editing && document.visibilityState === "visible") refreshList(false); });

  // ---------- ventanas ----------
  function modal(html, onMount){
    const root = $("#modalRoot");
    root.innerHTML = `<div class="overlay" id="ov"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
    const close = () => { root.innerHTML = ""; document.removeEventListener("keydown", onKey); };
    const onKey = e => { if (e.key==="Escape") close(); };
    document.addEventListener("keydown", onKey);
    $("#ov").addEventListener("click", e => { if (e.target.id==="ov") close(); });
    onMount?.(close);
    root.querySelector("input,textarea")?.focus();
  }

  function openLogin(){

  function logout(){ editing = false; password = ""; pending = null; try { sessionStorage.removeItem("dl_pw"); } catch {} setStatus(""); render(); }

  // Arrastrar filas dentro de un formulario (récords y runs)
  const rowHandle = `<span class="drag" data-rowdrag title="Arrastra para mover" aria-label="Arrastrar para mover">⠿</span>`;
  function enableRowDrag(box){
    box.addEventListener("pointerdown", e => {
      const h = e.target.closest("[data-rowdrag]"); if (!h || (e.button !== undefined && e.button !== 0)) return;
      e.preventDefault();
      const row = h.closest(".rec-edit"), scroller = box.closest(".modal");
      row.classList.add("dragging"); document.body.classList.add("is-dragging");
      let lastY = e.clientY;
      const place = y => {
        const rows = [...box.children].filter(x => x !== row);
        let target = null;
        for (const x of rows){ const b = x.getBoundingClientRect(); if (y < b.top + b.height/2){ target = x; break; } }
        if (target){ if (row.nextElementSibling !== target) box.insertBefore(row, target); }
        else if (box.lastElementChild !== row) box.appendChild(row);
      };
      const timer = setInterval(() => {
        if (!scroller) return;
        const b = scroller.getBoundingClientRect();
        if (lastY < b.top + 50) scroller.scrollTop -= 12; else if (lastY > b.bottom - 50) scroller.scrollTop += 12; else return;
        place(lastY);
      }, 30);
      const move = ev => { lastY = ev.clientY; place(ev.clientY); };
      const end = () => {
        clearInterval(timer);
        window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", end); window.removeEventListener("pointercancel", end);
        row.classList.remove("dragging"); document.body.classList.remove("is-dragging");
      };
      window.addEventListener("pointermove", move); window.addEventListener("pointerup", end); window.addEventListener("pointercancel", end);
    });

  }

  // ---------- pasar niveles entre la lista, futuros niveles y hardest runs ----------
  const LEVEL_FIELDS = ["name","publisher","creator","levelId","video","thumb","notes","art","artOpacity","artInProfile","profileImg"];
  const KIND_NAME = {d:"la lista", u:"Futuros niveles", r:"Hardest runs"};
  function findSource(key){
    const [kind, id] = String(key||"").split(":");
    const arr = kind === "u" ? state.upcoming : kind === "r" ? state.runs : kind === "d" ? state.demons : null;
    const src = (arr||[]).find(x => x.id === id);
    return src ? {kind, id, src} : null;
  }
  // target: "d" (demon), "u" (futuro nivel) o "r" (hardest run)
  function levelSource(key, target){
    const f = findSource(key); if (!f) return null;
    const {kind, src} = f, out = {};
    LEVEL_FIELDS.forEach(k => { if (src[k] !== undefined && src[k] !== "") out[k] = src[k]; });
    const best = kind === "r" ? bestRun(src) : null;
    if (target === "d"){
      if (kind === "u" && src.player) out.verifier = src.player;
      if (kind === "r" && best && clampPct(best.from) === 0 && clampPct(best.to) >= 100) out.verifier = best.player;
    }
    if (target === "u"){
      if (kind === "r" && best && clampPct(best.from) === 0){ out.player = best.player; out.progress = clampPct(best.to); }
    }
    if (target === "r"){

  function sourceOptions(target){

  }
  // Abre el formulario de destino ya lleno. Desde la lista siempre se copia.
  function transferLevel(key, target){
    const pre = levelSource(key, target); if (!pre) return;
    const kind = key.split(":")[0];

  function moveNotice(opts){
