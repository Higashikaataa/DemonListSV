<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demonlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: ranked list on the left, info/editor sidebar on the right; detail view replaces the list */
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface-2:#f6f8fb; --line:#dce1ea;
  --fg:#151a24; --muted:#5d6778; --accent:#c4253a; --accent-ink:#ffffff; --accent-soft:#fbe7ea;
  --gold:#b98a12; --silver:#7d8796; --bronze:#a3622c; --ok:#1d7a4b; --warn:#a15c00;
  --display:"Chakra Petch", "Arial Narrow", system-ui, sans-serif;
  --body:"Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1117; --surface:#161a22; --surface-2:#1c212b; --line:#2a313d;
  --fg:#e8ecf3; --muted:#9aa4b4; --accent:#ff4d62; --accent-ink:#1a0408; --accent-soft:#3a1720;
  --gold:#e6b94a; --silver:#b4bdca; --bronze:#d18a52; --ok:#4fc58a; --warn:#f0a845; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1117; --surface:#161a22; --surface-2:#1c212b; --line:#2a313d;
  --fg:#e8ecf3; --muted:#9aa4b4; --accent:#ff4d62; --accent-ink:#1a0408; --accent-soft:#3a1720;
  --gold:#e6b94a; --silver:#b4bdca; --bronze:#d18a52; --ok:#4fc58a; --warn:#f0a845; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand h1{font-family:var(--display);font-size:1.5rem;font-weight:700;margin:0;letter-spacing:.02em;line-height:1.1;text-wrap:balance}
.brand h1 span{color:var(--accent)}
.brand p{margin:0;color:var(--muted);font-size:.85rem}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{font-family:var(--display);font-weight:600;font-size:.9rem;letter-spacing:.04em;text-transform:uppercase;background:none;border:1px solid transparent;color:var(--muted);padding:7px 12px;border-radius:8px;cursor:pointer}
.tab:hover{color:var(--fg);background:var(--surface-2)}
.tab[aria-selected="true"]{color:var(--accent);border-color:var(--line);background:var(--surface-2)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main.wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;padding-block:24px 48px}
@media (max-width:860px){main.wrap{grid-template-columns:minmax(0,1fr)}}
.section-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.section-head h2{font-family:var(--display);font-size:1.35rem;margin:0;text-wrap:balance}
.section-head .count{color:var(--muted);font-size:.9rem}
.search{margin-left:auto;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0;width:220px;max-width:100%}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:minmax(150px,30%) minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;cursor:pointer;text-align:left;width:100%;transition:border-color .15s, transform .15s}
.row:hover{border-color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.row:hover{transform:translateX(2px)}}
.thumb{aspect-ratio:16/9;width:100%;max-width:100%;border-radius:7px;overflow:hidden;position:relative;background:linear-gradient(135deg,var(--surface-2),var(--accent-soft));display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{font-family:var(--display);font-weight:700;font-size:1.9rem;color:var(--accent);opacity:.85}
.row-main{min-width:0}
.row-title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pos{font-family:var(--display);font-weight:700;font-size:1.25rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.pos.p1{color:var(--gold)}.pos.p2{color:var(--silver)}.pos.p3{color:var(--bronze)}
.name{font-family:var(--display);font-weight:600;font-size:1.2rem;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:.88rem;overflow-wrap:anywhere}
.pts{font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.pts small{display:block;color:var(--muted);font-family:var(--body);font-weight:400;font-size:.75rem}
@media (max-width:520px){.row{grid-template-columns:minmax(0,38%) minmax(0,1fr) auto;gap:10px}.row .name{font-size:1rem}.pts{font-size:.9rem}.edit-tools{flex-direction:column}.thumb .ph{font-size:1.3rem}}
.row .name{font-size:1.3rem}
.pts.pct{color:var(--accent)}
.cl-list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.cl-item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 8px;font-size:.88rem;align-items:baseline}
.cl-date{font-family:var(--display);font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.cl-text{min-width:0;overflow-wrap:anywhere}
.cl-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:middle}
.cl-dot.add{background:var(--ok)}.cl-dot.down{background:var(--warn)}
.cl-edit{display:grid;grid-template-columns:140px minmax(0,1fr) auto;gap:6px;margin-bottom:6px}
.cl-edit input{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-width:0;width:100%}
@media (max-width:520px){.cl-edit{grid-template-columns:1fr auto}.cl-edit .t{grid-column:1/-1;grid-row:2}}
.edit-tools{display:flex;gap:4px}
.ibtn{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:4px 8px;cursor:pointer;font-size:.82rem;line-height:1.3}
.ibtn:hover{border-color:var(--accent);color:var(--accent)}
.ibtn:disabled{opacity:.4;cursor:default}
aside{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel h3{font-family:var(--display);font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
.panel p{margin:0 0 8px}
.panel p:last-child{margin-bottom:0}
.legend{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:.9rem}
.legend b{font-family:var(--display);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--accent)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.mode{display:flex;align-items:center;gap:8px;font-weight:600}
.switch{appearance:none;width:40px;height:22px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:left .15s}
.switch:checked{background:var(--accent)}
.switch:checked::after{left:21px}
.status{font-size:.85rem;color:var(--muted)}
.status.err{color:var(--accent)}
.status.ok{color:var(--ok)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:32px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--fg);font-family:var(--display);font-size:1.1rem;margin-bottom:4px}
/* detail */
.back{background:none;border:none;color:var(--accent);cursor:pointer;padding:0;font-weight:700;margin-bottom:12px}
.detail-hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
@media (max-width:640px){.detail-hero{grid-template-columns:minmax(0,1fr)}}
.detail-hero .thumb .ph{font-size:3rem}
.detail-hero h2{font-family:var(--display);font-size:2rem;margin:0;line-height:1.1;overflow-wrap:anywhere;text-wrap:balance}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:14px}
.fact{min-width:0}
.fact span{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.fact b{font-family:var(--display);font-weight:600;overflow-wrap:anywhere}
.chip{display:inline-block;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.chip.ext{background:var(--surface-2);color:var(--warn)}
.chip.leg{background:var(--surface-2);color:var(--muted)}
a{color:var(--accent)}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:16px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;background:var(--surface-2)}
tr:last-child td{border-bottom:none}
td.num{font-variant-numeric:tabular-nums;font-family:var(--display);font-weight:600}
.bar{display:inline-block;width:70px;height:6px;border-radius:3px;background:var(--line);vertical-align:middle;margin-left:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.full{background:var(--ok)}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,12,18,.55);z-index:20;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:min(640px,100%);max-height:calc(100% - 32px);overflow:auto;padding:20px}
.modal h3{font-family:var(--display);font-size:1.3rem;margin:0 0 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.82rem;font-weight:700;color:var(--muted);min-width:0}
label.f input,label.f textarea,label.f select{font-weight:400;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:8px 10px;min-width:0;width:100%}
.rec-edit{display:grid;grid-template-columns:minmax(0,1.3fr) 80px minmax(0,1.6fr) auto;gap:6px;margin-bottom:6px}
.rec-edit input{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-width:0;width:100%}
@media (max-width:520px){.rec-edit{grid-template-columns:1fr 70px auto}.rec-edit .v{grid-column:1/-1;grid-row:2}}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px;align-items:center}
.modal .foot .status{margin-right:auto}
.sub{font-family:var(--display);font-size:.9rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 8px}
.hint{font-size:.8rem;color:var(--muted);font-weight:400}
textarea.json{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;min-height:220px}
</style>
<style>
.top-links{display:flex;gap:8px;flex-wrap:wrap}
.top-links a{text-decoration:none}
.roul-card{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;align-items:center}
@media (max-width:640px){.roul-card{grid-template-columns:minmax(0,1fr)}}
.roul-need{font-family:var(--display);font-size:2.6rem;font-weight:700;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.roul-hist{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.roul-hist div{display:flex;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:.92rem}
.roul-hist b{font-family:var(--display);font-variant-numeric:tabular-nums}
.inline-form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.plink{background:none;border:none;padding:0;color:var(--accent);font-weight:700;cursor:pointer;text-align:left}
.plink:hover{text-decoration:underline}
.lvchips{display:flex;flex-wrap:wrap;gap:6px}
.lvchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:.9rem;max-width:100%;text-align:left}
.lvchip:hover{border-color:var(--accent)}
.lvpos{font-family:var(--display);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.lvpts{font-family:var(--display);font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:2px}
.inline-form input{width:110px;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:8px 10px}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1 id="siteTitle">Demonlist</h1>
      <p id="siteTag">Cargando lista…</p>
    </div>
    <nav class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-tab="main" aria-selected="true">Principal</button>
      <button class="tab" role="tab" data-tab="ext" aria-selected="false">Extendida</button>
      <button class="tab" role="tab" data-tab="leg" aria-selected="false">Legacy</button>
      <button class="tab" role="tab" data-tab="up" aria-selected="false">Futuros niveles</button>
      <button class="tab" role="tab" data-tab="stats" aria-selected="false">Leaderboard</button>
      <button class="tab" role="tab" data-tab="roul" aria-selected="false">Ruleta</button>
    </nav>
    <div class="top-links" id="topLinks"></div>
  </div>
</header>

<main class="wrap">
  <section id="view" aria-live="polite">
    <div class="empty"><strong>Cargando la lista</strong>Los demons aparecerán aquí en un momento.</div>
  </section>
  <aside>
    <div class="panel">
      <h3>Acerca de la lista</h3>
      <p id="aboutText"></p>
    </div>
    <div class="panel">
      <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:8px"><h3 style="margin:0;margin-right:auto">Changelog</h3>
        <button class="ibtn" id="clAll">Ver todo</button><button class="ibtn" id="clEdit" hidden>Editar</button></div>
      <ul class="cl-list" id="clList"></ul>
    </div>
    <div class="panel">
      <h3>Secciones</h3>
      <div class="legend" id="legend"></div>
    </div>
    <div class="panel" id="editorPanel">
      <h3>Editor</h3>
      <div id="loginBox">
        <p class="hint" style="margin-top:0">Solo para administradores de la lista.</p>
        <button class="btn" id="loginBtn">Entrar al modo editor</button>
      </div>
      <div id="editorTools" hidden>
        <div style="display:flex;flex-direction:column;gap:8px">
          <div class="btn-row">
            <button class="btn primary" id="addDemon">+ Agregar demon</button>
            <button class="btn" id="addUp">+ Futuro nivel</button>
            <button class="btn" id="editSite">Editar sitio</button>
          </div>
          <button class="btn" id="openJson">Importar / exportar JSON</button>
          <button class="btn" id="logoutBtn">Salir del modo editor</button>
        </div>
      </div>
      <p class="status" id="saveStatus" style="margin-top:10px"></p>
    </div>
  </aside>
</main>

<div id="modalRoot"></div>

<script>
(() => {
  const $ = (s, el=document) => el.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const uid = () => Math.random().toString(36).slice(2, 10);

  let state = { title:"Demonlist", tagline:"", about:"", discordUrl:"", submitUrl:"", mainSize:75, extSize:150, demons:[], upcoming:[], changelog:[] };
  let loaded = false, editing = false, password = "";
  let tab = "main", openDemon = null, openUp = null, query = "";
  try { password = sessionStorage.getItem("dl_pw") || ""; } catch {}

  // ---------- puntos (fórmula de Pointercrate: #1 = 350, #150 = 18.71) ----------
  function basePoints(pos){
    if (pos < 1 || pos > state.extSize || pos > 150) return 0;
    if (pos <= 3)  return -18.2899079915 * pos + 368.2899079915;
    if (pos <= 20) return (326.1 * Math.exp(-0.0871 * pos) + 51.09) * 1.037117142;
    if (pos <= 35) return ((250 - 83.389) * Math.pow(1.0099685, 2 - pos) - 31.152) * 1.0371139743;
    if (pos <= 55) return (212.61 * Math.pow(1.036, 1 - pos) + 25.071) * 1.0371139743;
    return (185.7 * Math.exp(-0.02715 * pos) + 14.84) * 1.039035131;
  }
  // List% que pones en cada nivel. Vacío o 100 = solo cuenta el 100%.
  // Al llegar justo al list% se gana el 10% de los puntos (ej. #1: 35.00), y sube hasta el total al 100%.
  function reqFor(d, pos){
    const r = Number(d.req);
    return (r >= 1 && r < 100) ? r : 100;
  }
  function recordPoints(pos, progress, req){
    const b = basePoints(pos);
    if (!b) return 0;
    if (progress >= 100) return b;
    // Como en Pointercrate: los porcentajes solo cuentan en la lista principal
    if (pos > state.mainSize || req >= 100 || progress < req) return 0;
    return b * Math.pow(5, (progress - req) / (100 - req)) / 10;
  }

  // ---------- jugadores ----------
  function buildPlayers(){
    const players = new Map();
    const get = name => {
      const k = name.toLowerCase();
      if (!players.has(k)) players.set(k, {name, pts:0, entries:[]});
      return players.get(k);
    };
    state.demons.forEach((d,i) => {
      const pos = i+1, req = reqFor(d,pos);
      const seen = new Set();
      const ver = (d.verifier||"").trim();
      if (ver){
        const p = get(ver); const pts = recordPoints(pos,100,req);
        p.pts += pts; p.entries.push({d,pos,progress:100,pts,verified:true,video:d.video});
        seen.add(ver.toLowerCase());
      }
      for (const r of d.records||[]){
        const name = (r.player||"").trim(); if (!name) continue;
        const k = name.toLowerCase();
        const pr = Math.max(0,Math.min(100,+r.progress||0));
        if (seen.has(k)){
          // mismo jugador repetido: se queda solo con su mejor progreso
          const p = get(name), e = p.entries.find(x => x.d === d);
          if (e && !e.verified && pr > e.progress){ const np = recordPoints(pos,pr,req); p.pts += np - e.pts; Object.assign(e,{progress:pr,pts:np,video:r.video}); }
          continue;
        }
        seen.add(k);
        const p = get(name), pts = recordPoints(pos,pr,req);
        p.pts += pts; p.entries.push({d,pos,progress:pr,pts,verified:false,video:r.video});
      }
    });
    const rows = [...players.values()].sort((a,b)=>b.pts-a.pts || a.name.localeCompare(b.name));
    rows.forEach((p,i) => p.rank = i+1);
    return rows;
  }
  let openPlayer = null;
  const fmt = n => n.toFixed(2);
  const section = pos => pos <= state.mainSize ? "main" : pos <= state.extSize ? "ext" : "leg";

  // ---------- YouTube ----------
  function ytId(v){
    if (!v) return "";
    if (/^[\w-]{11}$/.test(v)) return v;
    const m = v.match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/);
    return m ? m[1] : "";
  }
  function ytLink(v){
    if (!v) return "";
    if (/^https?:\/\//.test(v)) return v;
    return "https://www.youtube.com/watch?v=" + encodeURIComponent(v);
  }
  function thumbSrc(d){
    if (d.thumb) return d.thumb;
    const id = ytId(d.video);
    return id ? `https://img.youtube.com/vi/${id}/mqdefault.jpg` : "";
  }
  function thumbHTML(d, pos){
    const s = thumbSrc(d);
    return s ? `<div class="thumb"><img src="${esc(s)}" alt="" loading="lazy"></div>`
             : `<div class="thumb"><span class="ph">#${pos}</span></div>`;
  }

  // ---------- render ----------
  function render(){
    document.title = state.title || "Demonlist";
    $("#siteTitle").textContent = state.title || "Demonlist";
    $("#siteTag").textContent = state.tagline || "";
    $("#aboutText").textContent = state.about || "Ranking de demons ordenados por dificultad.";
    $("#legend").innerHTML = `<b>1–${state.mainSize}</b><span>Lista principal</span><b>${state.mainSize+1}–${state.extSize}</b><span>Lista extendida</span><b>${state.extSize+1}+</b><span>Legacy (sin puntos)</span>`;
    $("#topLinks").innerHTML =
      (state.discordUrl ? `<a class="btn" href="${esc(state.discordUrl)}" target="_blank" rel="noopener">Discord</a>` : "") +
      (state.submitUrl ? `<a class="btn primary" href="${esc(state.submitUrl)}" target="_blank" rel="noopener">Subir récord</a>` : "");
    document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.tab === tab && !openDemon && !openPlayer && !openUp)));
    renderChangelog();
    $("#clEdit").hidden = !editing;
    $("#loginBox").hidden = editing;
    $("#editorTools").hidden = !editing;
    if (!loaded) return;
    const v = $("#view");
    if (openDemon){ v.innerHTML = detailHTML(); bindDetail(); bindPlayerLinks(); return; }
    if (openPlayer){ v.innerHTML = profileHTML(); bindProfile(); return; }
    if (openUp){ v.innerHTML = upDetailHTML(); bindUpDetail(); return; }
    if (tab === "up"){ v.innerHTML = upListHTML(); bindUpList(); return; }
    if (tab === "stats"){ v.innerHTML = statsHTML(); bindPlayerLinks(); return; }
    if (tab === "roul"){ v.innerHTML = roulHTML(); bindRoul(); return; }
    v.innerHTML = listHTML();
    bindList();
  }

  function listHTML(){
    const names = {main:"Lista principal", ext:"Lista extendida", leg:"Legacy"};
    const all = state.demons.map((d,i) => ({d, pos:i+1})).filter(x => section(x.pos) === tab);
    const q = query.trim().toLowerCase();
    const items = q ? all.filter(x => [x.d.name,x.d.creator,x.d.verifier,x.d.publisher].join(" ").toLowerCase().includes(q)) : all;
    let html = `<div class="section-head"><h2>${names[tab]}</h2><span class="count">${all.length} demons</span>
      <input class="search" id="search" type="search" placeholder="Buscar nivel o creador" value="${esc(query)}" aria-label="Buscar"></div>`;
    if (!state.demons.length)
      return html + `<div class="empty"><strong>La lista está vacía</strong>Entra al modo editor y pulsa “Agregar demon” para empezar.</div>`;
    if (!items.length)
      return html + `<div class="empty"><strong>${q ? "Sin resultados" : "Nada en esta sección todavía"}</strong>${q ? "Prueba con otro nombre." : "Los demons aparecen aquí cuando la lista llega a esas posiciones."}</div>`;
    html += `<div class="list">`;
    for (const {d,pos} of items){
      const pc = pos<=3 ? " p"+pos : "";
      const tools = editing ? `<div class="edit-tools" data-stop>
          <button class="ibtn" data-act="up" data-id="${d.id}" ${pos===1?"disabled":""} aria-label="Subir">▲</button>
          <button class="ibtn" data-act="down" data-id="${d.id}" ${pos===state.demons.length?"disabled":""} aria-label="Bajar">▼</button>
          <button class="ibtn" data-act="edit" data-id="${d.id}">Editar</button></div>` :
        `<div class="pts">${basePoints(pos) ? fmt(basePoints(pos)) : "—"}<small>puntos</small></div>`;
      html += `<div class="row" role="button" tabindex="0" data-open="${d.id}">
        ${thumbHTML(d,pos)}
        <div class="row-main">
          <div class="row-title"><span class="pos${pc}">#${pos}</span><span class="name">${esc(d.name)}</span></div>
          <div class="meta">publicado por ${esc(d.publisher || d.creator || "—")}${d.verifier ? " · verificado por "+esc(d.verifier) : ""}</div>
        </div>
        ${tools}
      </div>`;
    }
    return html + `</div>`;
  }

  function bindList(){
    const s = $("#search");
    if (s) s.addEventListener("input", e => { query = e.target.value; const p = e.target.selectionStart; render(); const n=$("#search"); n.focus(); n.setSelectionRange(p,p); });
    document.querySelectorAll("[data-open]").forEach(r => {
      const go = e => { if (e.target.closest("[data-stop]")) return; openDemon = r.dataset.open; render(); window.scrollTo({top:0}); };
      r.addEventListener("click", go);
      r.addEventListener("keydown", e => { if (e.key==="Enter"||e.key===" "){ e.preventDefault(); go(e);} });
    });
    document.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", e => {
      e.stopPropagation();
      const i = state.demons.findIndex(d => d.id === b.dataset.id);
      if (b.dataset.act === "edit") return openDemonForm(state.demons[i]);
      const j = b.dataset.act === "up" ? i-1 : i+1;
      if (j<0 || j>=state.demons.length) return;
      const arr = state.demons.slice(); [arr[i],arr[j]] = [arr[j],arr[i]];
      save({...state, demons:arr}, {log:true});
    }));
  }

  function detailHTML(){
    const i = state.demons.findIndex(d => d.id === openDemon);
    if (i < 0){ openDemon = null; return listHTML(); }
    const d = state.demons[i], pos = i+1, sec = section(pos);
    const chip = sec==="main" ? `<span class="chip">Principal</span>` : sec==="ext" ? `<span class="chip ext">Extendida</span>` : `<span class="chip leg">Legacy</span>`;
    const recs = (d.records||[]).slice().sort((a,b)=>b.progress-a.progress);
    const video = ytLink(d.video), ts = thumbSrc(d), req = reqFor(d,pos);
    const progOk = basePoints(pos) && pos <= state.mainSize && req < 100;
    let html = `<button class="back" id="back">← Volver a la lista</button>
    <div class="detail-hero">
      ${ts ? `<div class="thumb"><img src="${esc(ts)}" alt="Miniatura de ${esc(d.name)}"></div>` : `<div class="thumb"><span class="ph">#${pos}</span></div>`}
      <div style="min-width:0">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px"><span class="pos${pos<=3?" p"+pos:""}">#${pos}</span>${chip}</div>
        <h2>${esc(d.name)}</h2>
        <div class="facts">
          <div class="fact"><span>Publicador</span><b>${esc(d.publisher||"—")}</b></div>
          <div class="fact"><span>Creador(es)</span><b>${esc(d.creator||"—")}</b></div>
          <div class="fact"><span>Verificador</span><b>${d.verifier?plink(d.verifier.trim()):"—"}</b></div>
          <div class="fact"><span>ID del nivel</span><b>${esc(d.levelId||"—")}</b></div>
          <div class="fact"><span>List%</span><b>${progOk?req+"%":"100%"}</b></div>
          <div class="fact"><span>Puntos (100%)</span><b>${basePoints(pos)?fmt(basePoints(pos)):"0"}</b></div>
        </div>
        <div class="btn-row" style="margin-top:14px">
          ${video ? `<a class="btn" href="${esc(video)}" target="_blank" rel="noopener">Ver verificación ↗</a>` : ""}
          ${editing ? `<button class="btn primary" id="editThis">Editar demon</button>` : ""}
        </div>
      </div>
    </div>
    ${d.notes ? `<div class="panel" style="margin-top:16px"><h3>Notas</h3><p>${esc(d.notes)}</p></div>` : ""}
    <div class="section-head" style="margin-top:22px;margin-bottom:0"><h2>Récords</h2><span class="count">${recs.length} ${recs.length===1?"récord":"récords"}${progOk?` · list%: ${req}%`:basePoints(pos)?" · solo cuenta el 100%":""}</span></div>`;
    if (!recs.length) return html + `<div class="empty" style="margin-top:12px"><strong>Sin récords aún</strong>${editing?"Pulsa “Editar demon” para añadir récords.":"Nadie ha registrado progreso en este nivel."}</div>`;
    html += `<div class="tablebox"><table><thead><tr><th>Jugador</th><th>Progreso</th><th>Puntos</th><th>Video</th></tr></thead><tbody>`;
    for (const r of recs){
      const p = Math.max(0,Math.min(100,+r.progress||0));
      html += `<tr><td>${r.player?plink(r.player.trim()):"—"}</td><td class="num">${p}% <span class="bar"><i class="${p>=100?"full":""}" style="width:${p}%"></i></span></td>
        <td class="num">${fmt(recordPoints(pos,p,req))}</td>
        <td>${r.video?`<a href="${esc(ytLink(r.video))}" target="_blank" rel="noopener">Abrir ↗</a>`:"—"}</td></tr>`;
    }
    return html + `</tbody></table></div>`;
  }
  function bindDetail(){ /* links de jugador se enlazan en render */
    $("#back")?.addEventListener("click", () => { openDemon = null; render(); });
    $("#editThis")?.addEventListener("click", () => openDemonForm(state.demons.find(d=>d.id===openDemon)));
  }

  const plink = name => `<button class="plink" data-player="${esc(name)}">${esc(name)}</button>`;
  function bindPlayerLinks(){
    document.querySelectorAll("[data-player]").forEach(b => b.addEventListener("click", e => {
      e.stopPropagation(); openPlayer = b.dataset.player.toLowerCase(); openDemon = null; render(); window.scrollTo({top:0});
    }));
  }

  function statsHTML(){
    const rows = buildPlayers();
    let html = `<div class="section-head"><h2>Leaderboard</h2><span class="count">${rows.length} jugadores · toca un nombre para ver su perfil</span></div>`;
    if (!rows.length) return html + `<div class="empty"><strong>Todavía no hay récords</strong>La tabla se llena sola cuando agregas récords o verificadores a los demons.</div>`;
    html += `<div class="tablebox" style="margin-top:0"><table><thead><tr><th>#</th><th>Jugador</th><th>Puntos</th><th>Completados</th><th>Verificados</th><th>En progreso</th><th>Más difícil</th></tr></thead><tbody>`;
    for (const p of rows){
      const done = p.entries.filter(e => e.progress >= 100);
      const hardest = done.reduce((a,e) => !a || e.pos < a.pos ? e : a, null);
      html += `<tr><td class="num">${p.rank}</td><td>${plink(p.name)}</td><td class="num">${fmt(p.pts)}</td>
        <td class="num">${done.length}</td><td class="num">${p.entries.filter(e=>e.verified).length}</td>
        <td class="num">${p.entries.filter(e=>e.progress<100).length}</td>
        <td>${hardest?esc(hardest.d.name)+` <span class="hint">(#${hardest.pos})</span>`:"—"}</td></tr>`;
    }
    return html + `</tbody></table></div>`;
  }

  function profileHTML(){
    const rows = buildPlayers();
    const p = rows.find(x => x.name.toLowerCase() === openPlayer);
    let html = `<button class="back" id="pback">← Volver al leaderboard</button>`;
    if (!p) return html + `<div class="empty"><strong>Jugador no encontrado</strong>Puede que lo hayan renombrado o quitado de la lista.</div>`;
    const by = (fn) => p.entries.filter(fn).sort((a,b)=>a.pos-b.pos);
    const verified = by(e => e.verified);
    const done = by(e => e.progress >= 100 && !e.verified);
    const prog = by(e => e.progress < 100);
    const hardest = by(e => e.progress >= 100)[0];
    const chips = (list, withPct) => list.length
      ? `<div class="lvchips">${list.map(e => `<button class="lvchip" data-demon="${e.d.id}"><span class="lvpos">#${e.pos}</span> ${esc(e.d.name)}${withPct?` <b>${e.progress}%</b>`:""}<span class="lvpts">${fmt(e.pts)}</span></button>`).join("")}</div>`
      : `<p class="hint" style="margin:0">Ninguno</p>`;
    const sectionBlock = (title, list, withPct) => {
      const parts = [["main","Lista principal"],["ext","Lista extendida"],["leg","Legacy"]]
        .map(([k,label]) => [label, list.filter(e => section(e.pos)===k)]).filter(([,l]) => l.length);
      return `<div class="panel"><h3>${title} · ${list.length}</h3>${
        parts.length ? parts.map(([label,l]) => `<div class="sub" style="margin:10px 0 6px">${label} (${l.length})</div>${chips(l,withPct)}`).join("") : `<p class="hint" style="margin:0">Ninguno</p>`
      }</div>`;
    };
    html += `<div class="detail-hero" style="grid-template-columns:minmax(0,1fr)">
      <div style="min-width:0">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px"><span class="pos${p.rank<=3?" p"+p.rank:""}">#${p.rank}</span><span class="chip">Leaderboard</span></div>
        <h2>${esc(p.name)}</h2>
        <div class="facts">
          <div class="fact"><span>Puntos</span><b>${fmt(p.pts)}</b></div>
          <div class="fact"><span>Completados</span><b>${verified.length + done.length}</b></div>
          <div class="fact"><span>Verificados</span><b>${verified.length}</b></div>
          <div class="fact"><span>En progreso</span><b>${prog.length}</b></div>
          <div class="fact"><span>Más difícil</span><b>${hardest?esc(hardest.d.name)+` (#${hardest.pos})`:"—"}</b></div>
        </div>
      </div></div>
      <div style="display:flex;flex-direction:column;gap:14px;margin-top:16px">
        ${sectionBlock("Verificados", verified, false)}
        ${sectionBlock("Completados", done, false)}
        ${sectionBlock("En progreso", prog, true)}
      </div>`;
    return html;
  }
  function bindProfile(){
    $("#pback")?.addEventListener("click", () => { openPlayer = null; tab = "stats"; render(); });
    document.querySelectorAll("[data-demon]").forEach(b => b.addEventListener("click", () => {
      openDemon = b.dataset.demon; openPlayer = null; render(); window.scrollTo({top:0});
    }));
  }

  // ---------- ruleta ----------
  // Reglas clásicas: el 1er demon pide 1%, cada siguiente pide 1% más que lo que lograste.
  let roul = null; // {pool, need, current, hist:[{name,got}], done, msg}
  function roulPool(scope){
    const n = scope === "ext" ? state.extSize : state.mainSize;
    return state.demons.slice(0, n).map((d,i)=>({d,pos:i+1}));
  }
  function roulNext(){
    if (!roul.pool.length){ roul.done = true; roul.msg = "Se acabaron los demons. ¡Ruleta completada!"; return; }
    const k = Math.floor(Math.random()*roul.pool.length);
    roul.current = roul.pool.splice(k,1)[0];
  }
  function roulHTML(){
    let html = `<div class="section-head"><h2>Ruleta</h2><span class="count">Empieza en 1% y cada demon pide 1% más que el anterior</span></div>`;
    if (!roul){
      return html + `<div class="panel"><p>Elige de dónde salen los demons y pulsa empezar.</p>
        <div class="inline-form"><select id="r_scope" class="btn" aria-label="Demons de la ruleta">
          <option value="main">Lista principal</option><option value="ext">Principal + extendida</option></select>
        <button class="btn primary" id="r_start">Empezar ruleta</button></div></div>`;
    }
    if (roul.done){
      html += `<div class="empty"><strong>${esc(roul.msg)}</strong>Llegaste a ${roul.hist.length} demons.</div>`;
    } else {
      const {d,pos} = roul.current;
      html += `<div class="roul-card">${thumbHTML(d,pos)}
        <div style="min-width:0"><span class="pos">#${pos}</span> <span class="name">${esc(d.name)}</span>
          <div class="meta">por ${esc(d.publisher||d.creator||"—")}${d.levelId?" · ID "+esc(d.levelId):""}</div>
          <div style="margin-top:12px" class="hint">Necesitas al menos</div><div class="roul-need">${roul.need}%</div>
          <form class="inline-form" id="r_form"><input type="number" id="r_got" min="${roul.need}" max="100" placeholder="${roul.need}" aria-label="Porcentaje logrado" required>
            <button class="btn primary" type="submit">Lo logré</button><button class="btn" type="button" id="r_quit">Rendirme</button></form>
          <p class="status err" id="r_msg"></p></div></div>`;
    }
    if (roul.hist.length){
      html += `<div class="roul-hist">` + roul.hist.map((h,i)=>`<div><span>${i+1}. ${esc(h.name)}</span><b>${h.got}%</b></div>`).join("") + `</div>`;
    }
    return html + `<div class="btn-row" style="margin-top:14px"><button class="btn" id="r_reset">Reiniciar ruleta</button></div>`;
  }
  function bindRoul(){
    $("#r_start")?.addEventListener("click", () => {
      const pool = roulPool($("#r_scope").value);
      if (!pool.length){ return; }
      roul = {pool, need:1, current:null, hist:[], done:false, msg:""}; roulNext(); render();
    });
    $("#r_form")?.addEventListener("submit", e => {
      e.preventDefault();
      const got = Math.round(Number($("#r_got").value));
      if (!(got >= roul.need && got <= 100)){ $("#r_msg").textContent = `Escribe un número entre ${roul.need} y 100.`; return; }
      roul.hist.push({name:roul.current.d.name, got});
      if (got >= 100){ roul.done = true; roul.msg = "¡Llegaste al 100%! Ruleta completada."; }
      else { roul.need = got + 1; roulNext(); }
      render();
    });
    $("#r_quit")?.addEventListener("click", () => { roul.done = true; roul.msg = `Te rendiste en ${roul.current.d.name} (necesitabas ${roul.need}%).`; render(); });
    $("#r_reset")?.addEventListener("click", () => { roul = null; render(); });
  }


  // ---------- changelog ----------
  const SEC_NAME = {main:"Lista principal", ext:"Lista extendida", leg:"Legacy"};
  const SEC_RANK = {main:0, ext:1, leg:2};
  function today(){
    const d = new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function fmtDate(iso){
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||"");
    if (!m) return esc(iso||"");
    const mes = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"][+m[2]-1] || m[2];
    return `${+m[3]} ${mes} ${m[1]}`;
  }
  // Compara la lista antes y después de un cambio y anota altas y bajadas de sección.
  function diffChanges(oldArr, newArr, cfg){
    const secOf = pos => pos <= cfg.mainSize ? "main" : pos <= cfg.extSize ? "ext" : "leg";
    const oldPos = new Map(oldArr.map((d,i) => [d.id, i+1]));
    const out = [], date = today();
    newArr.forEach((d,i) => {
      const pos = i+1;
      if (!oldPos.has(d.id)){
        out.push({id:uid(), date, type:"add", text:`${d.name} fue agregado en el puesto #${pos} (${SEC_NAME[secOf(pos)]})`});
        return;
      }
      const from = secOf(oldPos.get(d.id)), to = secOf(pos);
      if (SEC_RANK[to] > SEC_RANK[from])
        out.push({id:uid(), date, type:"down", text:`${d.name} bajó de ${SEC_NAME[from]} a ${SEC_NAME[to]} (#${pos})`});
    });
    return out;
  }
  function sortedLog(){
    return (state.changelog||[]).map((e,i)=>({e,i})).sort((a,b) => (b.e.date||"").localeCompare(a.e.date||"") || a.i-b.i).map(x=>x.e);
  }
  function clItem(e){
    return `<li class="cl-item"><span class="cl-date">${fmtDate(e.date)}</span><span class="cl-text"><span class="cl-dot ${e.type==="add"?"add":e.type==="down"?"down":""}"></span>${esc(e.text)}</span></li>`;
  }
  function renderChangelog(){
    const list = sortedLog();
    $("#clList").innerHTML = list.length ? list.slice(0,8).map(clItem).join("")
      : `<li class="hint">Aquí aparecerán los niveles agregados y los que bajen de sección.</li>`;
    $("#clAll").hidden = list.length <= 8;
  }
  function openChangelogAll(){
    modal(`<h3>Changelog</h3><ul class="cl-list">${sortedLog().map(clItem).join("") || `<li class="hint">Sin cambios todavía.</li>`}</ul>
      <div class="foot"><button class="btn" id="cancel">Cerrar</button></div>`, close => { $("#cancel").onclick = close; });
  }
  function clRow(e={id:uid(), date:today(), type:"note", text:""}){
    return `<div class="cl-edit" data-id="${esc(e.id)}" data-type="${esc(e.type||"note")}">
      <input type="date" value="${esc(e.date)}" data-k="date" aria-label="Fecha">
      <input class="t" value="${esc(e.text)}" data-k="text" placeholder="Qué cambió" aria-label="Texto">
      <button type="button" class="ibtn" data-del aria-label="Quitar entrada">✕</button></div>`;
  }
  function openChangelogEditor(){
    modal(`<h3>Editar changelog</h3>
      <p class="hint" style="margin-top:0">Las entradas se crean solas al agregar niveles o cuando uno baja de sección. Aquí puedes corregirlas, borrarlas o escribir otras.</p>
      <form id="clf"><div id="clRows">${sortedLog().map(clRow).join("")}</div>
      <button type="button" class="btn" id="clAdd">+ Añadir entrada</button>
      <div class="foot"><button type="button" class="btn" id="cancel">Cancelar</button><button class="btn primary" type="submit">Guardar</button></div></form>`, close => {
      $("#cancel").onclick = close;
      const bindDel = () => document.querySelectorAll("#clRows [data-del]").forEach(b => b.onclick = () => b.parentElement.remove());
      $("#clAdd").onclick = () => { $("#clRows").insertAdjacentHTML("afterbegin", clRow()); bindDel(); $("#clRows input.t").focus(); };
      bindDel();
      $("#clf").addEventListener("submit", e => {
        e.preventDefault();
        const log = [...document.querySelectorAll("#clRows .cl-edit")].map(r => ({
          id: r.dataset.id, type: r.dataset.type,
          date: r.querySelector('[data-k="date"]').value || today(),
          text: r.querySelector('[data-k="text"]').value.trim()
        })).filter(x => x.text);
        save({...state, changelog:log}); close();
      });
    });
  }

  // ---------- futuros niveles ----------
  const clampPct = v => Math.max(0, Math.min(100, Math.round(Number(v)||0)));
  function upListHTML(){
    const all = (state.upcoming||[]).map((d,i) => ({d, pos:i+1}));
    const q = query.trim().toLowerCase();
    const items = q ? all.filter(x => [x.d.name,x.d.creator,x.d.publisher,x.d.player].join(" ").toLowerCase().includes(q)) : all;
    let html = `<div class="section-head"><h2>Futuros niveles</h2><span class="count">${all.length} ${all.length===1?"nivel":"niveles"} en progreso</span>
      <input class="search" id="search" type="search" placeholder="Buscar nivel o jugador" value="${esc(query)}" aria-label="Buscar"></div>`;
    if (!all.length) return html + `<div class="empty"><strong>Todavía no hay futuros niveles</strong>${editing ? "Pulsa “+ Futuro nivel” en el panel del editor para agregar uno." : "Aquí aparecerán los niveles que alguien está por completar por primera vez."}</div>`;
    if (!items.length) return html + `<div class="empty"><strong>Sin resultados</strong>Prueba con otro nombre.</div>`;
    html += `<div class="list">`;
    for (const {d,pos} of items){
      const pct = clampPct(d.progress);
      const tools = editing ? `<div class="edit-tools" data-stop>
          <button class="ibtn" data-uact="up" data-id="${d.id}" ${pos===1?"disabled":""} aria-label="Subir">▲</button>
          <button class="ibtn" data-uact="down" data-id="${d.id}" ${pos===all.length?"disabled":""} aria-label="Bajar">▼</button>
          <button class="ibtn" data-uact="edit" data-id="${d.id}">Editar</button></div>`
        : `<div class="pts pct">${pct}%<small>progreso</small></div>`;
      html += `<div class="row" role="button" tabindex="0" data-uopen="${d.id}">
        ${thumbHTML(d,pos)}
        <div class="row-main">
          <div class="row-title"><span class="name">${esc(d.name)}</span></div>
          <div class="meta">${d.player ? "progreso de "+esc(d.player)+" · " : ""}publicado por ${esc(d.publisher || d.creator || "—")}</div>
          <div style="margin-top:6px"><span class="bar" style="margin-left:0;width:140px;max-width:100%"><i style="width:${pct}%"></i></span></div>
        </div>
        ${tools}
      </div>`;
    }
    return html + `</div>`;
  }
  function bindUpList(){
    const s = $("#search");
    if (s) s.addEventListener("input", e => { query = e.target.value; const p = e.target.selectionStart; render(); const n=$("#search"); n.focus(); n.setSelectionRange(p,p); });
    document.querySelectorAll("[data-uopen]").forEach(r => {
      const go = e => { if (e.target.closest("[data-stop]")) return; openUp = r.dataset.uopen; render(); window.scrollTo({top:0}); };
      r.addEventListener("click", go);
      r.addEventListener("keydown", e => { if (e.key==="Enter"||e.key===" "){ e.preventDefault(); go(e);} });
    });
    document.querySelectorAll("[data-uact]").forEach(b => b.addEventListener("click", e => {
      e.stopPropagation();
      const arr = (state.upcoming||[]).slice();
      const i = arr.findIndex(d => d.id === b.dataset.id);
      if (b.dataset.uact === "edit") return openUpForm(arr[i]);
      const j = b.dataset.uact === "up" ? i-1 : i+1;
      if (j<0 || j>=arr.length) return;
      [arr[i],arr[j]] = [arr[j],arr[i]];
      save({...state, upcoming:arr});
    }));
  }
  function upDetailHTML(){
    const d = (state.upcoming||[]).find(x => x.id === openUp);
    if (!d){ openUp = null; return upListHTML(); }
    const pct = clampPct(d.progress), ts = thumbSrc(d), video = ytLink(d.video);
    return `<button class="back" id="uback">← Volver a futuros niveles</button>
    <div class="detail-hero">
      ${ts ? `<div class="thumb"><img src="${esc(ts)}" alt="Miniatura de ${esc(d.name)}"></div>` : `<div class="thumb"><span class="ph">?</span></div>`}
      <div style="min-width:0">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px"><span class="chip ext">Futuro nivel</span></div>
        <h2>${esc(d.name)}</h2>
        <div class="facts">
          <div class="fact"><span>Publicador</span><b>${esc(d.publisher||"—")}</b></div>
          <div class="fact"><span>Creador(es)</span><b>${esc(d.creator||"—")}</b></div>
          <div class="fact"><span>ID del nivel</span><b>${esc(d.levelId||"—")}</b></div>
          <div class="fact"><span>Jugador</span><b>${esc(d.player||"—")}</b></div>
          <div class="fact"><span>Progreso</span><b>${pct}%</b> <span class="bar"><i class="${pct>=100?"full":""}" style="width:${pct}%"></i></span></div>
        </div>
        <div class="btn-row" style="margin-top:14px">
          ${video ? `<a class="btn" href="${esc(video)}" target="_blank" rel="noopener">Ver progreso ↗</a>` : ""}
          ${editing ? `<button class="btn primary" id="editUp">Editar nivel</button>` : ""}
        </div>
      </div>
    </div>
    ${d.notes ? `<div class="panel" style="margin-top:16px"><h3>Notas</h3><p>${esc(d.notes)}</p></div>` : ""}`;
  }
  function bindUpDetail(){
    $("#uback")?.addEventListener("click", () => { openUp = null; tab = "up"; render(); });
    $("#editUp")?.addEventListener("click", () => openUpForm((state.upcoming||[]).find(x => x.id === openUp)));
  }
  function openUpForm(d){
    const isNew = !d, list = state.upcoming||[];
    d = d || {id:uid(), name:"", publisher:"", creator:"", levelId:"", player:"", progress:0, video:"", thumb:"", notes:""};
    const curPos = isNew ? list.length+1 : list.findIndex(x=>x.id===d.id)+1;
    const max = isNew ? list.length+1 : list.length;
    modal(`<h3>${isNew?"Agregar futuro nivel":"Editar futuro nivel"}</h3>
      <form id="uf">
      <div class="grid2">
        <label class="f">Nombre del nivel<input id="u_name" required value="${esc(d.name)}"></label>
        <label class="f">Orden (1–${max})<input id="u_pos" type="number" min="1" max="${max}" value="${curPos}"></label>
        <label class="f">Publicador<input id="u_pub" value="${esc(d.publisher)}"></label>
        <label class="f">Creador(es)<input id="u_cre" value="${esc(d.creator)}"></label>
        <label class="f">Jugador que lo está jugando<input id="u_pl" value="${esc(d.player)}"></label>
        <label class="f">Progreso (%)<input id="u_pr" type="number" min="0" max="100" value="${clampPct(d.progress)}"></label>
        <label class="f">ID del nivel<input id="u_lid" value="${esc(d.levelId)}"></label>
        <label class="f">Video del progreso<input id="u_vid" placeholder="Link de YouTube" value="${esc(d.video)}"></label>
      </div>
      <label class="f" style="margin-top:12px">Miniatura personalizada <span class="hint">Opcional. Si la dejas vacía se usa la del video de YouTube.</span>
        <input id="u_thumb" value="${esc(d.thumb)}" placeholder="URL de una imagen"></label>
      <label class="f" style="margin-top:12px">Notas<textarea id="u_notes" rows="2">${esc(d.notes)}</textarea></label>
      <div class="foot">
        <span class="status" id="uStatus"></span>
        ${isNew ? "" : `<button type="button" class="btn danger" id="uDel">Eliminar</button>`}
        <button type="button" class="btn" id="cancel">Cancelar</button>
        <button type="submit" class="btn primary">${isNew?"Agregar":"Guardar"}</button>
      </div></form>`, close => {
      $("#cancel").onclick = close;
      const del = $("#uDel");
      if (del) del.onclick = () => {
        if (del.dataset.confirm){ if (openUp===d.id) openUp=null; save({...state, upcoming:list.filter(x=>x.id!==d.id)}); close(); }
        else { del.dataset.confirm = "1"; del.textContent = "¿Seguro? Pulsa otra vez"; }
      };
      $("#uf").addEventListener("submit", e => {
        e.preventDefault();
        const nd = {...d, name:$("#u_name").value.trim(), publisher:$("#u_pub").value.trim(), creator:$("#u_cre").value.trim(),
          player:$("#u_pl").value.trim(), progress:clampPct($("#u_pr").value), levelId:$("#u_lid").value.trim(),
          video:$("#u_vid").value.trim(), thumb:$("#u_thumb").value.trim(), notes:$("#u_notes").value.trim()};
        if (!nd.name){ $("#uStatus").textContent = "Escribe el nombre del nivel."; return; }
        const arr = list.filter(x=>x.id!==d.id);
        const p = Math.max(1, Math.min(arr.length+1, Number($("#u_pos").value)||arr.length+1));
        arr.splice(p-1, 0, nd);
        save({...state, upcoming:arr}); close();
      });
    });
  }

  // ---------- guardar ----------
  let saving = Promise.resolve();
  function setStatus(msg, cls=""){ const s=$("#saveStatus"); s.textContent=msg; s.className="status "+cls; }
  function save(next, opts={}){
    if (opts.log){
      const entries = diffChanges(state.demons||[], next.demons||[], next);
      if (entries.length) next = {...next, changelog:[...entries, ...(next.changelog||[])]};
    }
    state = next; render();
    setStatus("Guardando…");
    const body = JSON.stringify(state);
    saving = saving.then(() => fetch("/api/list", {method:"PUT", headers:{"content-type":"application/json","x-admin-password":password}, body}))
      .then(async r => {
        if (r.ok){ setStatus("Cambios guardados.","ok"); return true; }
        const e = await r.json().catch(()=>({}));
        if (r.status === 401){ logout(); setStatus("La contraseña ya no es válida. Entra de nuevo; tus últimos cambios no se guardaron.","err"); }
        else setStatus("No se guardó: " + (e.error || "error " + r.status),"err");
        return false;
      })
      .catch(() => { setStatus("No se guardó: revisa tu conexión.","err"); return false; });
    return saving;
  }

  // ---------- ventanas ----------
  function modal(html, onMount){
    const root = $("#modalRoot");
    root.innerHTML = `<div class="overlay" id="ov"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
    const close = () => { root.innerHTML = ""; document.removeEventListener("keydown", onKey); };
    const onKey = e => { if (e.key==="Escape") close(); };
    document.addEventListener("keydown", onKey);
    $("#ov").addEventListener("click", e => { if (e.target.id==="ov") close(); });
    onMount?.(close);
    root.querySelector("input,textarea")?.focus();
  }

  function openLogin(){
    modal(`<h3>Modo editor</h3><form id="lf">
      <label class="f">Contraseña<input type="password" id="l_pw" autocomplete="current-password" required></label>
      <div class="foot"><span class="status err" id="lStatus"></span>
      <button type="button" class="btn" id="cancel">Cancelar</button><button class="btn primary" type="submit">Entrar</button></div></form>`, close => {
      $("#cancel").onclick = close;
      $("#lf").addEventListener("submit", async e => {
        e.preventDefault();
        const pw = $("#l_pw").value;
        $("#lStatus").textContent = "Comprobando…";
        try {
          const r = await fetch("/api/login", {method:"POST", headers:{"x-admin-password":pw}});
          if (!r.ok){ $("#lStatus").textContent = "Contraseña incorrecta."; return; }
          password = pw; editing = true;
          try { sessionStorage.setItem("dl_pw", pw); } catch {}
          close(); setStatus("Modo editor activo."); render();
        } catch { $("#lStatus").textContent = "No hay conexión con el servidor."; }
      });
    });
  }
  function logout(){ editing = false; password = ""; try { sessionStorage.removeItem("dl_pw"); } catch {} setStatus(""); render(); }

  function recRow(r={player:"",progress:100,video:""}){
    return `<div class="rec-edit"><input placeholder="Jugador" value="${esc(r.player)}" data-k="player" aria-label="Jugador">
      <input type="number" min="0" max="100" value="${esc(r.progress)}" data-k="progress" aria-label="Progreso %">
      <input class="v" placeholder="Video (link de YouTube)" value="${esc(r.video)}" data-k="video" aria-label="Video">
      <button type="button" class="ibtn" data-del aria-label="Quitar récord">✕</button></div>`;
  }

  function openDemonForm(d){
    const isNew = !d;
    d = d || {id:uid(), name:"", creator:"", publisher:"", verifier:"", levelId:"", req:null, video:"", thumb:"", notes:"", records:[]};
    const curPos = isNew ? state.demons.length+1 : state.demons.findIndex(x=>x.id===d.id)+1;
    const max = isNew ? state.demons.length+1 : state.demons.length;
    modal(`<h3>${isNew?"Agregar demon":"Editar demon"}</h3>
      <form id="df">
      <div class="grid2">
        <label class="f">Nombre del nivel<input id="f_name" required value="${esc(d.name)}"></label>
        <label class="f">Posición (1–${max})<input id="f_pos" type="number" min="1" max="${max}" value="${curPos}"></label>
        <label class="f">Publicador<input id="f_pub" value="${esc(d.publisher)}"></label>
        <label class="f">Creador(es)<input id="f_cre" value="${esc(d.creator)}"></label>
        <label class="f">Verificador<input id="f_ver" value="${esc(d.verifier)}"></label>
        <label class="f">ID del nivel<input id="f_lid" value="${esc(d.levelId)}"></label>
        <label class="f">List% <span class="hint">solo top ${state.mainSize}; vacío = solo 100%</span><input id="f_req" type="number" min="1" max="99" placeholder="Solo 100%" value="${(+d.req>=1 && +d.req<100)?esc(d.req):""}"></label>
        <label class="f">Video de verificación<input id="f_vid" placeholder="Link de YouTube" value="${esc(d.video)}"></label>
      </div>
      <label class="f" style="margin-top:12px">Miniatura personalizada <span class="hint">Opcional. Si la dejas vacía se usa la del video de YouTube.</span>
        <input id="f_thumb" value="${esc(d.thumb)}" placeholder="URL de una imagen"></label>
      <label class="f" style="margin-top:12px">Notas<textarea id="f_notes" rows="2">${esc(d.notes)}</textarea></label>
      <div class="sub">Récords</div>
      <div id="recs">${(d.records||[]).map(recRow).join("")}</div>
      <button type="button" class="btn" id="addRec">+ Añadir récord</button>
      <div class="foot">
        <span class="status" id="formStatus"></span>
        ${isNew ? "" : `<button type="button" class="btn danger" id="delBtn">Eliminar</button>`}
        <button type="button" class="btn" id="cancel">Cancelar</button>
        <button type="submit" class="btn primary">${isNew?"Agregar":"Guardar"}</button>
      </div></form>`, close => {
      $("#cancel").onclick = close;
      const bindRecDel = () => document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => b.parentElement.remove());
      $("#addRec").onclick = () => { $("#recs").insertAdjacentHTML("beforeend", recRow()); bindRecDel(); };
      bindRecDel();
      const del = $("#delBtn");
      if (del) del.onclick = () => {
        if (del.dataset.confirm){ if (openDemon===d.id) openDemon=null; save({...state, demons:state.demons.filter(x=>x.id!==d.id)}, {log:true}); close(); }
        else { del.dataset.confirm = "1"; del.textContent = "¿Seguro? Pulsa otra vez"; }
      };
      $("#df").addEventListener("submit", e => {
        e.preventDefault();
        const recs = [...document.querySelectorAll(".rec-edit")].map(r => ({
          player: r.querySelector('[data-k="player"]').value.trim(),
          progress: Math.max(0, Math.min(100, Number(r.querySelector('[data-k="progress"]').value)||0)),
          video: r.querySelector('[data-k="video"]').value.trim()
        })).filter(r => r.player);
        const nd = {...d, name:$("#f_name").value.trim(), publisher:$("#f_pub").value.trim(), creator:$("#f_cre").value.trim(),
          verifier:$("#f_ver").value.trim(), levelId:$("#f_lid").value.trim(), req:(()=>{ const r=Number($("#f_req").value); return (r>=1 && r<100) ? Math.round(r) : null; })(),
          video:$("#f_vid").value.trim(), thumb:$("#f_thumb").value.trim(), notes:$("#f_notes").value.trim(), records:recs};
        if (!nd.name){ $("#formStatus").textContent = "Escribe el nombre del nivel."; return; }
        const arr = state.demons.filter(x=>x.id!==d.id);
        const p = Math.max(1, Math.min(arr.length+1, Number($("#f_pos").value)||arr.length+1));
        arr.splice(p-1, 0, nd);
        save({...state, demons:arr}, {log:true}); close();
      });
    });
  }

  function openSiteForm(){
    modal(`<h3>Editar sitio</h3><form id="sf">
      <label class="f">Título<input id="s_title" value="${esc(state.title)}"></label>
      <label class="f" style="margin-top:12px">Subtítulo<input id="s_tag" value="${esc(state.tagline)}"></label>
      <label class="f" style="margin-top:12px">Texto “Acerca de”<textarea id="s_about" rows="3">${esc(state.about)}</textarea></label>
      <div class="grid2" style="margin-top:12px">
        <label class="f">Link de Discord<input id="s_dc" value="${esc(state.discordUrl)}" placeholder="https://discord.gg/..."></label>
        <label class="f">Link para subir récords<input id="s_sub" value="${esc(state.submitUrl)}" placeholder="https://..."></label>
        <label class="f">Tamaño lista principal<input id="s_main" type="number" min="1" value="${state.mainSize}"></label>
        <label class="f">Último puesto de la extendida<input id="s_ext" type="number" min="1" value="${state.extSize}"></label>
      </div>
      <div class="foot"><button type="button" class="btn" id="cancel">Cancelar</button><button class="btn primary" type="submit">Guardar</button></div></form>`, close => {
      $("#cancel").onclick = close;
      $("#sf").addEventListener("submit", e => {
        e.preventDefault();
        const m = Math.max(1, Number($("#s_main").value)||75);
        const x = Math.max(m, Number($("#s_ext").value)||150);
        save({...state, title:$("#s_title").value.trim()||"Demonlist", tagline:$("#s_tag").value.trim(), about:$("#s_about").value.trim(),
          discordUrl:$("#s_dc").value.trim(), submitUrl:$("#s_sub").value.trim(), mainSize:m, extSize:x});
        close();
      });
    });
  }

  function openJson(){
    modal(`<h3>Importar / exportar JSON</h3>
      <p class="hint" style="margin-top:0">Copia este texto para hacer un respaldo. Para importar, pega un JSON con el mismo formato y pulsa “Reemplazar lista”.</p>
      <label class="f">Datos<textarea class="json" id="j_txt">${esc(JSON.stringify(state,null,2))}</textarea></label>
      <div class="foot"><span class="status" id="jStatus"></span>
        <button class="btn" id="jCopy">Copiar</button><button class="btn" id="cancel">Cerrar</button><button class="btn primary" id="jImport">Reemplazar lista</button></div>`, close => {
      $("#cancel").onclick = close;
      $("#jCopy").onclick = () => {
        const t = $("#j_txt");
        navigator.clipboard?.writeText(t.value).then(()=>$("#jStatus").textContent="Copiado.").catch(()=>{ t.select(); $("#jStatus").textContent="Texto seleccionado: usa Ctrl+C."; });
      };
      const imp = $("#jImport");
      imp.onclick = () => {
        let data;
        try { data = JSON.parse($("#j_txt").value); } catch { $("#jStatus").textContent = "El JSON no es válido."; return; }
        if (!Array.isArray(data.demons)){ $("#jStatus").textContent = "Falta la lista “demons”."; return; }
        if (!imp.dataset.confirm){ imp.dataset.confirm="1"; imp.textContent="¿Seguro? Pulsa otra vez"; return; }
        data.demons = data.demons.map(d => ({records:[], ...d, id:d.id||uid()}));
        if (data.upcoming && !Array.isArray(data.upcoming)) delete data.upcoming;
        if (data.changelog && !Array.isArray(data.changelog)) delete data.changelog;
        save({...state, ...data}); openDemon=null; close();
      };
    });
  }

  // ---------- eventos ----------
  $("#tabs").addEventListener("click", e => {
    const t = e.target.closest(".tab"); if (!t) return;
    tab = t.dataset.tab; openDemon = null; openPlayer = null; openUp = null; query = ""; render();
  });
  $("#loginBtn").onclick = openLogin;
  $("#logoutBtn").onclick = logout;
  $("#addDemon").onclick = () => openDemonForm(null);
  $("#editSite").onclick = openSiteForm;
  $("#openJson").onclick = openJson;
  $("#addUp").onclick = () => { tab = "up"; openDemon = openPlayer = openUp = null; render(); openUpForm(null); };
  $("#clAll").onclick = openChangelogAll;
  $("#clEdit").onclick = openChangelogEditor;

  async function boot(){
    if (password){
      try { const r = await fetch("/api/login",{method:"POST",headers:{"x-admin-password":password}}); editing = r.ok; if (!r.ok) logout(); } catch {}
    }
    try {
      const r = await fetch("/api/list", {cache:"no-store"});
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || "Error " + r.status);
      state = {...state, ...d};
      state.demons = (state.demons||[]).map(x => ({records:[], ...x}));
      state.upcoming = Array.isArray(state.upcoming) ? state.upcoming : [];
      state.changelog = Array.isArray(state.changelog) ? state.changelog : [];
      loaded = true; render();
    } catch (err) {
      loaded = true; render();
      $("#view").innerHTML = `<div class="empty"><strong>No se pudo cargar la lista</strong>${esc(err.message || "Revisa tu conexión y recarga la página.")}</div>`;
    }
  }
  render();
  boot();
})();
</script>
</body>
</html>
